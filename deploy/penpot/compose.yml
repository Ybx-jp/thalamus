# Penpot — the `designer` expert's design tool, self-hosted (docs/08).
#
# Deployed under the four conditions the homelab expert measured on this box
# (consultation `scope:main:exchange:432ff6f9cd6f43ba`). Two of them are encoded
# in this file and the other two are in README.md, because they are not compose's
# to enforce.
#
# 1. THE SYSTEM ENGINE, NOT DOCKER DESKTOP. Every command here must carry
#    `--context default`. The active context on this box is `desktop-linux`, a
#    qemu VM with a hard 8GiB ceiling that also holds the unbounded graph
#    container, and it is bound to `graphical-session.target` — a GNOME logout
#    tears down the engine and everything in it. An unqualified `docker compose
#    up -d` lands there silently. The user unit in this directory pins the
#    context so the daily path cannot get it wrong.
#
# 2. ITS OWN TAILNET HOSTNAME, via the sidecar below. Not a subpath: Penpot is a
#    root-scoped SPA emitting absolute asset and websocket URLs, and
#    `tailscale serve` strips the mount path, so `/penpot/` resolves its `/js/...`
#    against the existing `/` mount and 404s — ttyd only survives a subpath
#    because it has `--base-path`, which Penpot has no equivalent of. And not a
#    port: Android WebAPKs ignore the port, so the ts.net hostname is ONE app
#    namespace, and a root-scoped install would capture `/console`, `/pulse`,
#    `/course` and block the phone control plane
#    (`scope:homelab:claim:84bce1c8c285f6dd`). A distinct MagicDNS name is a
#    distinct Android namespace, which is the only shape that satisfies both.
#    It also isolates Penpot's own service worker, which root-scoped would claim
#    fetches for every other surface — a cost this box has already paid once
#    (`scope:homelab:claim:b8b1aa2cbd3c2b53`).
#
# 3. EXPLICIT mem_limit ON EVERY CONTAINER, below. The exporter is the one that
#    spikes: it drives headless Chromium.
#
# 4. Jellyfin NVENC — see README.md. Not compose's business, but it is where the
#    CPU headroom this stack consumes comes from.

name: penpot

services:
  # The service names below are short, but every container also answers to its
  # `penpot-` prefixed alias, because the frontend image ships a baked nginx.conf
  # with `upstream penpot-backend` / `penpot-exporter` hardcoded. Without the
  # aliases nginx dies at startup with "host not found in upstream" and the
  # frontend restart-loops while every other container looks healthy.
  #
  # The three penpot images are pinned, not floating, because the patches encode
  # assumptions about Penpot's schema and `:latest` moves that schema with no local
  # change. `patches/0003` needs >= 2.17.0 — the release that added `:stroke-dash`
  # and `:stroke-gap` to `schema:stroke-attrs`. Below that floor the map is
  # `:closed true` without those keys and a dashed stroke carrying dash geometry is
  # refused by validate-shape.
  #
  # Upgrading is deliberate: bump all three together, then re-run the patch build,
  # which fails loudly on any hunk that no longer matches. Verify a running
  # container with:
  #   docker --context default exec penpot-frontend-1 cat /var/www/app/version.txt
  frontend:
    image: penpotapp/frontend:2.17.0
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - backend
      - exporter
    networks:
      default:
        aliases: [penpot-frontend]
    volumes:
      - penpot-assets:/opt/data/assets
    environment:
      PENPOT_FLAGS: "$PENPOT_FLAGS"

  backend:
    image: penpotapp/backend:2.17.0
    restart: unless-stopped
    # The JVM. Measured Penpot guidance puts steady state well under this; the
    # limit exists so a runaway cannot reach the host, not as a tuning target.
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      default:
        aliases: [penpot-backend]
    volumes:
      - penpot-assets:/opt/data/assets
    environment:
      PENPOT_FLAGS: "$PENPOT_FLAGS"
      PENPOT_PUBLIC_URI: "$PENPOT_PUBLIC_URI"
      PENPOT_SECRET_KEY: "$PENPOT_SECRET_KEY"
      PENPOT_DATABASE_URI: "postgresql://postgres/penpot"
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: "$PENPOT_DATABASE_PASSWORD"
      PENPOT_REDIS_URI: "redis://redis/0"
      PENPOT_ASSETS_STORAGE_BACKEND: assets-fs
      PENPOT_STORAGE_ASSETS_FS_DIRECTORY: /opt/data/assets
      # No outbound mail configured, so email verification would strand the only
      # account this instance will ever have. Single operator, tailnet-only.
      PENPOT_SMTP_ENABLED: "false"
      PENPOT_TELEMETRY_ENABLED: "false"

  exporter:
    image: penpotapp/exporter:2.17.0
    restart: unless-stopped
    # Headless Chromium. This is the container homelab named as the one that
    # spikes during large exports, and the reason every service here is capped.
    mem_limit: 1g
    networks:
      default:
        aliases: [penpot-exporter]
    environment:
      # Shared with the backend, and required — the exporter refuses to start
      # without it (`:secret-key` is the one non-optional key in its config
      # schema, and the failure is a malli validation dump, not a clear message).
      PENPOT_SECRET_KEY: "$PENPOT_SECRET_KEY"
      PENPOT_PUBLIC_URI: "http://penpot-frontend:8080"
      PENPOT_REDIS_URI: "redis://redis/0"

  postgres:
    image: postgres:15
    restart: unless-stopped
    mem_limit: 1g
    stop_signal: SIGINT  # postgres fast shutdown
    environment:
      POSTGRES_INITDB_ARGS: "--data-checksums"
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: "$PENPOT_DATABASE_PASSWORD"
    volumes:
      - penpot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    restart: unless-stopped
    mem_limit: 256m

  # The tool surface the `designer` scope actually works through: 68 MCP tools that
  # create shapes, frames, text and components, export SVG/PNG, and read the design
  # system. Third-party (github.com/ancrz/penpot-mcp-server), built from a pinned
  # commit recorded in README.md rather than a floating clone, and NOT vendored —
  # `penpot-mcp-server/` is gitignored, so the build context is a checkout the README
  # tells you how to make.
  #
  # Trust posture: it reads Penpot's Postgres directly with asyncpg, which bypasses
  # Penpot's authorization model entirely, and writes through the RPC API. Everything
  # it returns is tier-2 data under docs/05 — it informs, it never instructs.
  #
  # Reachable on loopback only. The MCP client is `claude` on this host, so it needs
  # a host port; nothing outside the box has any business here, and the tailnet
  # sidecar deliberately does not proxy it.
  mcp:
    build:
      context: ./penpot-mcp-server
      # Our fixes to the upstream server live in ./patches as git-format diffs and
      # are applied HERE, during the build, never in the checkout. The clone stays
      # byte-identical to the pinned commit, so the README's `git clone && git
      # checkout <pin>` remains the whole install and a re-clone destroys nothing.
      # `patch -F0` refuses any fuzz, so if the pin ever moves and a hunk no longer
      # matches, that patch fails. `set -e` on the loop is what turns that into a
      # failed build: a `for` loop's status is its LAST iteration's, so without it a
      # broken 0001 followed by a clean 0002 exits 0 and ships a half-patched image
      # with a silent `.rej` on disk. Both are load-bearing; -F0 alone does not catch it.
      additional_contexts:
        patches: ./patches
      # Upstream's own Dockerfile, plus one constraint, inline so it survives a
      # re-clone. The repo ships no uv.lock and declares `mcp[cli]>=1.9.0`, a
      # floor with no ceiling — so a build today resolves mcp 2.0.0, which dropped
      # `mcp.server.fastmcp`, and the container crash-loops on ImportError with a
      # green `Built` line above it. Pinning `<2` is the whole fix.
      dockerfile_inline: |
        FROM python:3.13-slim
        COPY --from=ghcr.io/astral-sh/uv:latest /uv /usr/local/bin/uv
        RUN apt-get update \
            && apt-get install -y --no-install-recommends patch \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY pyproject.toml ./
        RUN sed -i 's/mcp\[cli\]>=1.9.0/mcp[cli]>=1.9.0,<2/' pyproject.toml \
            && uv sync --no-dev --no-install-project
        COPY src/ src/
        COPY --from=patches . /patches/
        RUN set -e; for p in /patches/*.patch; do patch -p1 -F0 --no-backup-if-mismatch < "$$p"; done
        RUN uv sync --no-dev
        EXPOSE 8787
        # The venv entrypoint, not `uv run`: `uv run` re-syncs at every container
        # start, which pulls the dev dependencies (ruff, mypy) the image was built
        # `--no-dev` to avoid and delays first response by ~10s on a cold start.
        CMD ["/app/.venv/bin/penpot-mcp"]
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:8787:8787"
      # The plugin bridge, for the live-canvas tools. The Penpot editor is a browser
      # app, so `localhost` is wherever the browser runs: editing from THIS box's own
      # browser, ws://localhost:4402 reaches this container. Editing from a phone or
      # another tailnet device it does not, because localhost is that device — the
      # headless tools are unaffected either way.
      - "127.0.0.1:4402:4402"
    environment:
      PENPOT_BASE_URL: "http://penpot-frontend:8080"
      PENPOT_PUBLIC_URL: "$PENPOT_PUBLIC_URI"
      # Generated in Penpot: avatar → Access Tokens. Without it the server starts
      # but every write is unauthenticated and fails.
      PENPOT_ACCESS_TOKEN: "$PENPOT_ACCESS_TOKEN"
      # Rendering only. The exporter authenticates by an `auth-token` COOKIE and
      # by nothing else, and Penpot mints that cookie only from
      # login-with-password (or SSO/LDAP) — an access token has no exchange path
      # to a session. Every other tool runs on the access token alone; without
      # these two, export_frame_png and export_frame_svg return an error saying
      # so. See README.md.
      PENPOT_EMAIL: "$PENPOT_EMAIL"
      PENPOT_PASSWORD: "$PENPOT_PASSWORD"
      PENPOT_DB_HOST: postgres
      PENPOT_DB_PORT: "5432"
      PENPOT_DB_NAME: penpot
      PENPOT_DB_USER: penpot
      PENPOT_DB_PASS: "$PENPOT_DATABASE_PASSWORD"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8787"
      WS_HOST: "0.0.0.0"
      WS_PORT: "4402"
      PLUGIN_WS_URL: "ws://localhost:4402"

  # Condition 2. Its own tailnet identity, so Penpot gets `/` on a hostname that
  # is not the one carrying the console PWA. TS_SERVE_CONFIG terminates TLS and
  # proxies to the frontend over the compose network; nothing is published to the
  # host, so this listens on the tailnet and nowhere else.
  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    mem_limit: 128m
    hostname: penpot
    environment:
      TS_AUTHKEY: "$TS_AUTHKEY"
      TS_HOSTNAME: penpot
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - penpot-tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro

volumes:
  penpot-assets:
  penpot-postgres:
  penpot-tailscale:
