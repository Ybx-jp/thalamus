# Counterfactual task (docs/04 layer 2). Tier-0 operator artifact: the git
# history of this file is its pre-registration timestamp.
#
# Replayed from the 2026-07-19 session where consult_request refused with
# "scope holds no memory" against eval-methodology, which held 11 claims
# (fixed in commit 09c8dd1). Memorization stratum. The live-graph oracle
# assumes the consulted scope holds knowledge claims but no episodic
# sessions/threads (true of eval-methodology at authoring; the runner pins
# the graph snapshot, so runs inherit that state).

# NOTE ON REFS: the repository's history was rewritten on 2026-07-29 (git-filter-repo,
# scrubbing a licence phrase across 41 commits), which changed every SHA and left this
# task's `ref`/`fix_ref` pointing at objects that no longer exist. The refs below were
# remapped through `.git/filter-repo/commit-map`; the *content* of each commit is
# unchanged, so the pre-registration this file's git history carries is intact. Old
# SHAs are kept beside the new ones so the chain stays auditable.
#   a7fc38e -> b4ac18e · 9f28895 -> 09c8dd1

task: v0
id: consultation-empty-brief-refusal
title: Consultation refusal conflates empty scope with no match
overlap: memorization
source:
  kind: replayed
  ref: "b4ac18e"
  fix_ref: 09c8dd1
  evidence: >-
    Session of 2026-07-19 (fix commit 09c8dd1): eval-methodology held 11
    claims, 2 sources, 5 entities and was reported as holding no memory.

prompt: |
  consult_request sometimes refuses with "scope holds no memory to consult —
  ingest into it first" against scopes that demonstrably hold claims. It
  happens whenever the question's vocabulary doesn't lexically match anything
  in the consulted scope. Make the refusal honest: the two different failures
  (a genuinely empty scope, versus a question that matched nothing) should be
  distinguishable and each should name its own remedy. No refusal path may
  write an orphan Exchange record.

acceptance:
  # L1 — no-regression gate: the pre-existing suite must stay green.
  - run: "uv run pytest -q"
    expect_exit: 0
    level: 1
    name: no-regression
  # L2 — targeted behavioral oracle for this bug.
  - run: |
      uv run python - <<'PYEOF'
      # Behavioral oracle against the live graph: a nonsense question to a
      # knowledge-only scope must be refused without claiming the scope is
      # empty, and must not mint an exchange.
      from thalamus.harness.consultation import consult_request
      from thalamus.substrate.writer import connect, close_connection

      g = connect()
      try:
          msg = consult_request(g, "eval-methodology", "zzqxv wvvkq nonsense probe", "main")
      finally:
          close_connection(g)
      assert "refused" in msg.lower(), "nonsense question minted a ticket"
      assert "holds no memory" not in msg, "non-empty scope reported as empty"
      PYEOF
    expect_exit: 0

# Probes re-authored 2026-07-19 to the lab/011 rule: the first campaign
# measured the old probes hitting in memory-off ("holds no memory" survives
# any competent fix; the live graph is reachable from every arm via ad-hoc
# gremlin, so graph-derivable facts don't discriminate either). The tokens
# below are verified absent from ref b4ac18e and from this prompt; they
# exist only in the memory graph — the consultation exchange minted during
# the original diagnosis, the authoring session's node, and the fix's
# helper name.
    level: 2
    name: behavioral
probes:
  - id: memo-surfaced
    requires: memory_surface
    kind: transcript_regex
    pattern: '8644614d1b1242a4|accfe19d-ef4b-42ee-a895-04892b55ab9a'
    meaning: >-
      The original diagnosis reached context via recall: the eval-methodology
      exchange minted that session (8644614d…) or the authoring session's
      node (accfe19d…) rendered — neither exists in the worktree at this ref
      nor in the prompt. Surfacing signal; the acceptance/cost deltas say
      whether it mattered.
  - id: fix-name-convergence
    kind: diff_regex
    pattern: '_scope_holds_memory'
    meaning: >-
      The candidate's fix converged on the memorized fix's helper name,
      absent from the repo at this ref. Suggestive corroboration next to
      memo-surfaced, never proof alone.

rubric: |
  Do the two refusals name the remedy for their actual condition (rephrase in
  the expert's vocabulary vs. ingest)? Is the emptiness probe cheap (bounded,
  read-only) and does the no-match branch avoid extra graph round trips on the
  happy path?
