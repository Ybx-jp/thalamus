          assert not any(NONSENSE in t.lower() for t in corpus), "nonsense token is not nonsense"
          # A probe whose seams would split into 2+ keywords if the keyword rule changed.
          probe3 = pick(corpus, corpus, want_multipart=True) or probe2
          expect3 = holder(g, probe3, know)
          assert expect3, f"floor probe {probe3!r} resolves to no node"

          # (a) the match floor is intact, and the probe still counts as ONE keyword:
          # a two-term query whose second term hits nothing must rank nothing.
          for variant in orbit(probe3):
              got = keys(rec(g, f"{variant} {NONSENSE}", know))
              check(
                  got == set(),
                  f"[R3/floor] recall({variant + ' ' + NONSENSE!r}) -> {sorted(got)}; "
                  "want nothing (one distinct keyword hit is below the floor, and the "
                  "term must count as a single keyword)",
              )

          # (b) the floor is not raised either: two terms that both hit still rank.
          htext = next(t for t in corpus if probe3.lower() in t.lower())
          htokens = {
              raw.strip(PUNCT) for raw in htext.split() if WORD.fullmatch(raw.strip(PUNCT))
          }
          ranked = sorted(htokens, key=lambda w: (not distinctive(w), w))
          second = next((w for w in ranked if w.lower() != probe3.lower()), None)
          if second:
              for variant in orbit(probe3):
                  got = keys(rec(g, f"{variant} {second}", know))
                  check(
                      got == expect3,
                      f"[R3/floor+] recall({variant + ' ' + second!r}) -> {sorted(got)}; "
                      f"want {sorted(expect3)}",
                  )
          else:
              print("note: no second distinctive term in the probe's text; floor+ check skipped")

          # (c) what counts as a keyword is unchanged: an all-stopword query still falls
          # back to the recency path, in any casing.
          recent = keys(reader.recall_recent(g, LIMIT, MAIN))
          for q in ("what is the it", "WHAT IS THE IT", "What Is The It"):
              got = keys(rec(g, q, know))
              check(got == recent, f"[R3/keywords] recall({q!r}) is not the recency fallback")

          # (d) queries that already worked still work: an all-lowercase distinctive term.
          low_probe = pick(corpus, corpus, mixed_case=False)
          if low_probe:
              expect_low = holder(g, low_probe, know)
              if expect_low:
                  got = keys(rec(g, low_probe, know))
                  check(
                      got == expect_low,
                      f"[R3/lowercase] recall({low_probe!r}) -> {sorted(got)}; "
                      f"want {sorted(expect_low)}",
                  )
          else:
              print("note: no all-lowercase distinctive probe; lowercase regression check skipped")

          # (e) the verbatim sites stayed verbatim — artifact identifiers.
          all_idents = [str(v) for v in g.V().has_label("Artifact").values("identifier").to_list()]
          reachable = sorted(
              {
                  str(v)
                  for v in g.V().has_label("Session").has("scope", MAIN)
                  .out("CONTAINS").out("TOUCHES").has_label("Artifact")
                  .values("identifier").dedup().to_list()
              }
          )
          ident = next(
              (
                  i
                  for i in reachable
                  if any(c.isalpha() for c in i)
                  and i.swapcase() != i
                  and not any(i.swapcase() in a for a in all_idents)
              ),
              None,
          )
          assert ident, "no artifact identifier usable as a verbatim probe"
          check(
              reader.recall_by_artifact(g, ident, limit=LIMIT, scope=MAIN) != [],
              f"[R3/artifact] recall_by_artifact({ident!r}) returned nothing — probe is unsound",
          )
          flipped = reader.recall_by_artifact(g, ident.swapcase(), limit=LIMIT, scope=MAIN)
          check(
              flipped == [],
              f"[R3/artifact] recall_by_artifact({ident.swapcase()!r}) matched "
              f"{len(flipped)} session(s); artifact matching must stay verbatim",
          )

          # (f) ... and project matching.
          all_projects = [
              str(v)
              for v in g.V().has_label("Session").has("scope", MAIN).values("project").to_list()
          ]
          proj = next(
              (
                  p
                  for p in sorted(set(all_projects))
                  if any(c.isalpha() for c in p)
                  and p.swapcase() != p
                  and not any(p.swapcase() in q for q in all_projects)
              ),
              None,
          )
          assert proj, "no project value usable as a verbatim probe"
          check(
              reader.recall_by_project(g, proj, limit=LIMIT, scope=MAIN) != [],
              f"[R3/project] recall_by_project({proj!r}) returned nothing — probe is unsound",
          )
          flipped = reader.recall_by_project(g, proj.swapcase(), limit=LIMIT, scope=MAIN)
          check(
              flipped == [],
              f"[R3/project] recall_by_project({proj.swapcase()!r}) matched "
              f"{len(flipped)} session(s); project matching must stay verbatim",
          )
          if reader.recall_open_threads(g, project=proj, limit=LIMIT, scope=MAIN):
              flipped = reader.recall_open_threads(g, project=proj.swapcase(), limit=LIMIT, scope=MAIN)
              check(
                  flipped == [],
                  f"[R3/project] recall_open_threads({proj.swapcase()!r}) matched "
                  f"{len(flipped)} thread(s); project matching must stay verbatim",
              )

      finally:
          close_connection(g)

      report('R3')
      PYEOF
    expect_exit: 0
    level: 5
    name: relation-r3
probes:
  - id: memo-surfaced
    requires: memory_surface
    kind: transcript_regex
    pattern: 'accfe19d-ef4b-42ee-a895-04892b55ab9a'
    meaning: >-
      The authoring session's node was rendered into context by recall — its
      UUID exists nowhere in the worktree at this ref and not in the prompt.
      This is a surfacing signal, not a use signal: it says the memo reached
      context, and the acceptance/cost deltas say whether that mattered.
  - id: fix-name-convergence
    kind: diff_regex
    pattern: '_keyword_predicate'
    meaning: >-
      The candidate's fix converged on the memorized fix's helper name, which
      is absent from the repo at this ref. Suggestive of memo reuse rather
      than proof — a candidate could coin the same natural name — so this
      probe reads as corroboration next to memo-surfaced, never alone.

rubric: |
  Is the fix at the predicate layer — one place all three keyword sites share —
  rather than scattered per call site or solved by duplicating each keyword in
  multiple casings? Does it leave the artifact/project verbatim-match sites
  untouched?

# Mutants — the discrimination bar (docs/04). Anchors cover the range endpoints;
# these cover the interior, where all 18 observed arms sit. Each is a degradation
# of the known-good fix (e0c56d2) with its rung committed here BEFORE the gate
# ran — the git history of this block is the pre-registration timestamp, and a
# disagreement gets resolved in the open rather than by editing the number.
#
# `mimics` is mandatory and it is what separates this from classical mutation
# testing. The classical licence — competent programmer hypothesis plus the
# coupling effect (2103.07189 finds mutants coupled to real high-priority faults;
# 2512.16741 makes coupling measured rather than assumed) — describes *human*
# programmers making small syntactic slips. These candidates are LLM agents, which
# fail differently, so every mutant names the observed arm behavior it stands in
# for instead of applying a syntactic operator and hoping.
mutants:
  - id: m1-partial-session-site
    patch: mutants/reader-case-insensitive-recall/m1-partial-session-site.patch
    expected_rung: 3
    mimics: >-
      The fix applied where the bug report's example pointed and nowhere else.
      The report's symptom is knowledge claims going unfound, so both Claim sites
      get the predicate and the Session.summary site keeps TextP.containing —
      a candidate that read the repro rather than the recall path.
    rationale: >-
      L2 passes (the report's own query returns claims) and R1 passes (its probe
      is drawn from claim text), but R2 asserts EVERY keyword site is case-blind
      across the case orbit, so the ladder should stop at 3. This is the mutant
      that separates "fixed the symptom" from "diagnosed the path".
  - id: m2-overfix-verbatim-sites
    patch: mutants/reader-case-insensitive-recall/m2-overfix-verbatim-sites.patch
    expected_rung: 4
    mimics: >-
      The over-fix: a candidate that treats "case-insensitive matching" as a
      global good and applies it to recall_by_artifact and recall_by_project too,
      changing behavior the report never asked about. The commonest LLM failure
      shape on this task class — plausible, thorough-looking, out of scope.
    rationale: >-
      R1 and R2 both pass (every keyword site really is case-blind), so only R3's
      guards (e) and (f) — artifact identifiers and project matching stay verbatim
      — should catch it. Expected rung 4.
  - id: m3-floor-lowered
    patch: mutants/reader-case-insensitive-recall/m3-floor-lowered.patch
    expected_rung: 4
    mimics: >-
      Collateral loosening: the candidate makes the failing query return something
      by lowering the match floor to one term, the fix the prompt explicitly
      forbids ("without loosening the match floor").
    rationale: >-
      L2's noise probe cannot catch this — "zzqxv wvvkq" matches nothing at any
      floor — so this mutant tests whether R3(a) is doing work that L2 is not.
      If it scores 5, the floor guard is decorative. Expected rung 4.
  - id: m4-stopword-fallback-dropped
    patch: mutants/reader-case-insensitive-recall/m4-stopword-fallback-dropped.patch
    expected_rung: 4
    mimics: >-
      A rewrite of the keyword path that drops a behavior nobody mentioned: an
      all-stopword query stops falling back to the recency path and returns
      nothing. The "plausible wholesale rewrite" mode — locally sensible, quietly
      lossy.
    rationale: >-
      Nothing below R3 exercises the empty-keyword path, so this is the mutant
      that tests guard (c) specifically. Expected rung 4.
  - id: m5-equivalent-renamed-helper
    patch: mutants/reader-case-insensitive-recall/m5-equivalent-renamed-helper.patch
    expected_rung: 5
    mimics: >-
      Not a defect: a CORRECT fix written differently — same case-insensitive
      regex semantics, helper named `_ci_contains`, pattern built with a
      non-capturing group. Every arm writes its own fix, and none of them will
      choose the historical name.
    rationale: >-
      The equivalent mutant, deliberate rather than a nuisance: undecidability
      does not bite because equivalence is known by construction. It must score 5.
      Anything less means the ladder rewards imitating e0c56d2 instead of grading
      behavior — the failure docs/04 requires the relations be behavioral to
      avoid. This is also the mutant that proved `tests/` must be pinned to
      source.ref: the fix's own unit test imports `_keyword_predicate` by name,
      so grading against it would fail a correct fix on an ImportError.
