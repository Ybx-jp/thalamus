task: v0
id: reader-case-insensitive-recall
title: Recall silently misses capitalized query terms
overlap: memorization
source:
  kind: replayed
  ref: "09c8dd1"
  fix_ref: e0c56d2
  evidence: >-
    Session of 2026-07-19 (fix commit e0c56d2): "LLM-as-a-Judge reliability"
    returned nothing against a scope holding four claims containing both terms.

prompt: |
  Narrow memory_recall queries that use distinctive capitalized terms — for
  example "Mem2ActBench", "MemoryBank", "LLM-as-a-Judge" — return "No matching
  memories found" even though the graph holds claims containing those exact
  terms. Queries made of lowercase words match fine. Diagnose the recall path
  and fix it so capitalized terms match, without loosening the match floor or
  changing what counts as a keyword.

acceptance:
  # L1 — no-regression gate: the pre-existing suite must stay green.
  - run: "uv run pytest -q"
    expect_exit: 0
    level: 1
    name: no-regression
  # L2 — targeted behavioral oracle for this bug.
  - run: |
      uv run python - <<'PYEOF'
      # Behavioral oracle, implementation-agnostic: capitalized-term recall
      # finds knowledge claims; nonsense two-term queries still find nothing
      # (the match floor survived the fix).
      from thalamus.contract.manifest import available_scopes
      from thalamus.substrate.reader import recall
      from thalamus.substrate.writer import connect, close_connection

      g = connect()
      try:
          scopes = [s for s in available_scopes() if s != "main"]
          hits = recall(g, "LLM-as-a-Judge reliability", 5, "main", knowledge_scopes=scopes)
          assert hits, "capitalized-term recall still returns nothing"
          noise = recall(g, "zzqxv wvvkq", 5, "main", knowledge_scopes=scopes)
          assert not noise, "match floor loosened: nonsense terms now match"
      finally:
          close_connection(g)
      PYEOF
    expect_exit: 0

