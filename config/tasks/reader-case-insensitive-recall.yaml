# unreachable from the prompt plus general competence. The first campaign
# measured the old probes (re.escape, lab/006-7 mentions) hitting in
# memory-off — competence echo, and the repo at this ref carries the lab
# notebook and dial comments, so anything written down here discriminates
# nothing. Both tokens below are verified absent from ref 09c8dd1
# (`git grep`) and from this prompt; they exist only in the memory graph
# once the authoring session (accfe19d) distills.
    level: 2
    name: behavioral
  # L3-L5 — nested metamorphic relations, each strictly implying the one
  # below. Authored under a held-out protocol from the bug report alone, by
  # an agent denied the fix commit (e0c56d2), so they cannot re-encode the
  # known solution. Behavioral, not syntactic: they survive refactoring and
  # reward no helper name. Validated against ground truth — the negative
  # anchor (09c8dd1, bug present) violates all three; the positive anchor
  # (e0c56d2, the real fix) satisfies all three.
  # R1 — a distinctive capitalized term the graph holds is recalled,
  # and recall gives the same answer for its all-lowercase spelling.
  # From the report: "the graph holds claims containing those exact terms".
  - run: |
      uv run python - <<'PYEOF'
      import re
      import sys

      from gremlin_python.process.graph_traversal import __
      from gremlin_python.process.traversal import P, TextP

      from thalamus.substrate import reader
      from thalamus.substrate.writer import close_connection, connect

      MAIN = "main"
      LIMIT = 10
      PUNCT = "\"'`()[]{}<>,.;:!?"
      WORD = re.compile(r"[A-Za-z][A-Za-z0-9-]{3,}\Z")


      def one(v):
          if isinstance(v, list):
              return str(v[0]) if v else ""
          return str(v) if v is not None else ""


      def keys(results):
          out = set()
          for r in results:
              sid = getattr(r, "session_id", "")
              out.add(("session", sid) if sid else ("claim", getattr(r, "node_id", "")))
          return out


      def distinctive(w):
          """A token no keyword rule could call a stopword: hyphen, digit, or camel seam."""
          return (
              "-" in w
              or any(c.isdigit() for c in w)
              or any(w[i].islower() and w[i + 1].isupper() for i in range(len(w) - 1))
          )


      def multipart(w):
          """Splitting this token on its seams would yield 2+ tokens long enough to
          count as keywords — so it is a probe that notices if a term gets split."""
          parts = re.split(r"[-_]|(?<=[a-z0-9])(?=[A-Z])", w)
          return len([p for p in parts if len(p) > 2]) >= 2


      def tokens(texts, mixed_case=True):
          out = set()
          for text in texts:
              for raw in text.split():
                  w = raw.strip(PUNCT)
                  if not WORD.fullmatch(w) or not distinctive(w):
                      continue
                  has_up = any(c.isupper() for c in w)
                  has_lo = any(c.islower() for c in w)
                  if mixed_case and not (has_up and has_lo):
                      continue
                  if not mixed_case and has_up:
                      continue
                  out.add(w)
          return out


      def load(g):
          scopes = sorted({one(s) for s in g.V().has_label("Claim").values("scope").dedup().to_list()})
          know = [s for s in scopes if s != MAIN]
          summaries = [
              one(r.get("summary"))
              for r in g.V().has_label("Session").has("scope", MAIN).value_map("summary").to_list()
          ]
          episodic = [
              one(r.get("description"))
              for r in g.V().has_label("Claim").has("scope", MAIN).where(__.in_e("CONTAINS"))
              .value_map("description").to_list()
          ]
          knowledge = [
              one(r.get("description"))
              for r in g.V().has_label("Claim").has("scope", P.within([MAIN, *know]))
              .not_(__.in_e("CONTAINS")).value_map("description").to_list()
          ]
          return know, {"session": summaries, "episodic": episodic, "knowledge": knowledge}


      def pick(site_texts, corpus, mixed_case=True, want_multipart=False):
          """Lexicographically first token occurring in exactly one corpus text
          case-insensitively, whose lowercase form occurs in no text verbatim."""
          lowered = [t.lower() for t in corpus]
          cands = tokens(site_texts, mixed_case)
          if want_multipart:
              cands = {w for w in cands if multipart(w)}
          for w in sorted(cands):
              low = w.lower()
              if sum(1 for t in lowered if low in t) != 1:
                  continue
              if mixed_case and any(low in t for t in corpus):
                  continue
              return w
          return None


      def holder(g, probe, know):
          """Ground truth: which node holds `probe`, resolved with verbatim exact-case queries."""
          expected = set()
          for r in (
              g.V().has_label("Session").has("scope", MAIN)
              .has("summary", TextP.containing(probe)).value_map("session_id").to_list()
          ):
              expected.add(("session", one(r.get("session_id"))))
          for r in (
              g.V().has_label("Claim").has("scope", MAIN)
              .has("description", TextP.containing(probe))
              .in_e("CONTAINS").out_v().has_label("Session").value_map("session_id").to_list()
          ):
              expected.add(("session", one(r.get("session_id"))))
          for v in (
              g.V().has_label("Claim").has("scope", P.within([MAIN, *know]))
              .has("description", TextP.containing(probe))
              .not_(__.in_e("CONTAINS")).id_().to_list()
          ):
              expected.add(("claim", str(v)))
          return expected


      def rec(g, q, know):
          return reader.recall(g, q, limit=LIMIT, scope=MAIN, knowledge_scopes=know)


      def orbit(w):
          return sorted({w, w.lower(), w.upper(), w.swapcase(), w.title()})


      FAILS = []


      def check(ok, msg):
          if not ok:
              FAILS.append(msg)


      def report(name):
          if FAILS:
              print(f"{name} VIOLATED:")
              for f in FAILS:
                  print("  - " + f)
              sys.exit(1)
          print(f"{name} holds")


      g = connect()
      try:
          know, sites = load(g)
          corpus = sites["session"] + sites["episodic"] + sites["knowledge"]

          # R1 — a distinctive capitalized term the graph verifiably holds is recalled,
          # and recall gives the same answer for its all-lowercase spelling.
          # The report's own wording — "the graph holds claims containing those exact
          # terms" — so the probe is drawn from claim text.
          probe1 = pick(sites["episodic"], corpus)
          assert probe1, "graph holds no case-discriminating probe token"
          expect1 = holder(g, probe1, know)
          assert expect1, f"probe {probe1!r} resolves to no node"
          got1 = keys(rec(g, probe1, know))
          check(got1 == expect1, f"[R1] recall({probe1!r}) -> {sorted(got1)}; want {sorted(expect1)}")
          check(
              got1 == keys(rec(g, probe1.lower(), know)),
              f"[R1] recall({probe1!r}) != recall({probe1.lower()!r})",
          )

      finally:
          close_connection(g)

      report('R1')
      PYEOF
    expect_exit: 0
    level: 3
    name: relation-r1
