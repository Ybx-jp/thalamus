# Counterfactual task (docs/04 layer 2). Tier-0 operator artifact: the git
# history of this file is its pre-registration timestamp.
#
# Replayed from the 2026-07-19 session that found recall's lowercased keywords
# could never match capitalized text (fixed in commit 8b70330). Memorization
# stratum: that session distills the exact diagnosis and fix into memory, so
# memory-on arms are answering from the solution, not from transferable claims.

task: v0
id: reader-case-insensitive-recall
title: Recall silently misses capitalized query terms
overlap: memorization
source:
  kind: replayed
  ref: "9f28895"
  fix_ref: 8b70330
  evidence: >-
    Session of 2026-07-19 (fix commit 8b70330): "LLM-as-a-Judge reliability"
    returned nothing against a scope holding four claims containing both terms.

prompt: |
  Narrow memory_recall queries that use distinctive capitalized terms — for
  example "Mem2ActBench", "MemoryBank", "LLM-as-a-Judge" — return "No matching
  memories found" even though the graph holds claims containing those exact
  terms. Queries made of lowercase words match fine. Diagnose the recall path
  and fix it so capitalized terms match, without loosening the match floor or
  changing what counts as a keyword.

acceptance:
  # L1 — no-regression gate: the pre-existing suite must stay green.
  - run: "uv run pytest -q"
    expect_exit: 0
    level: 1
    name: no-regression
  # L2 — targeted behavioral oracle for this bug.
  - run: |
      uv run python - <<'PYEOF'
      # Behavioral oracle, implementation-agnostic: capitalized-term recall
      # finds knowledge claims; nonsense two-term queries still find nothing
      # (the match floor survived the fix).
      from thalamus.contract.manifest import available_scopes
      from thalamus.substrate.reader import recall
      from thalamus.substrate.writer import connect, close_connection

      g = connect()
      try:
          scopes = [s for s in available_scopes() if s != "main"]
          hits = recall(g, "LLM-as-a-Judge reliability", 5, "main", knowledge_scopes=scopes)
          assert hits, "capitalized-term recall still returns nothing"
          noise = recall(g, "zzqxv wvvkq", 5, "main", knowledge_scopes=scopes)
          assert not noise, "match floor loosened: nonsense terms now match"
      finally:
          close_connection(g)
      PYEOF
    expect_exit: 0

# Probes re-authored 2026-07-19 to the lab/011 rule: target knowledge
# unreachable from the prompt plus general competence. The first campaign
# measured the old probes (re.escape, lab/006-7 mentions) hitting in
# memory-off — competence echo, and the repo at this ref carries the lab
# notebook and dial comments, so anything written down here discriminates
# nothing. Both tokens below are verified absent from ref 9f28895
# (`git grep`) and from this prompt; they exist only in the memory graph
# once the authoring session (accfe19d) distills.
    level: 2
    name: behavioral
probes:
  - id: memo-surfaced
    kind: transcript_regex
    pattern: 'accfe19d-ef4b-42ee-a895-04892b55ab9a'
    meaning: >-
      The authoring session's node was rendered into context by recall — its
      UUID exists nowhere in the worktree at this ref and not in the prompt.
      This is a surfacing signal, not a use signal: it says the memo reached
      context, and the acceptance/cost deltas say whether that mattered.
  - id: fix-name-convergence
    kind: diff_regex
    pattern: '_keyword_predicate'
    meaning: >-
      The candidate's fix converged on the memorized fix's helper name, which
      is absent from the repo at this ref. Suggestive of memo reuse rather
      than proof — a candidate could coin the same natural name — so this
      probe reads as corroboration next to memo-surfaced, never alone.

rubric: |
  Is the fix at the predicate layer — one place all three keyword sites share —
  rather than scattered per call site or solved by duplicating each keyword in
  multiple casings? Does it leave the artifact/project verbatim-match sites
  untouched?
