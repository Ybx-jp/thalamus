# Counterfactual task (docs/04 layer 2). Tier-0 operator artifact: the git
# history of this file is its pre-registration timestamp.
#
# The battery's first UNDER-SPECIFIED task. lab/018 measured that memory-on arms
# call a thalamus tool at 2/21 while real interactive sessions in this repo call
# it at 20/31, and a controlled probe holding the harness completely fixed showed
# the difference is carried entirely by the prompt: a self-contained bug report
# yields zero recall, a past-work question yields recall. Both pre-existing tasks
# hand the candidate symptom, counterexample and constraint, so nothing is
# unreachable and reaching for memory is correctly dominated by reading source.
#
# This task withholds the constraint instead. Designed with the eval-methodology
# expert across two rounds — exchanges `scope:main:exchange:5c5c57142ffc43ef`
# (ceiling-gated/floor-preserved; necessity belongs in the source input, never in
# a relation's predicate) and `scope:main:exchange:1ef0d3649b5b495f` (the
# rung-witness rule, the obsolete-set construction, and the derivability caveat
# on R3).

# NOTE ON REFS: the repository's history was rewritten on 2026-07-29 (git-filter-repo,
# scrubbing a licence phrase across 41 commits), which changed every SHA and left this
# task's `ref`/`fix_ref` pointing at objects that no longer exist. The refs below were
# remapped through `.git/filter-repo/commit-map`; the *content* of each commit is
# unchanged, so the pre-registration this file's git history carries is intact. Old
# SHAs are kept beside the new ones so the chain stays auditable.
#   1fc6aef -> 2cbe7cf · 4432703 -> 71ae0df

task: v0
id: arm-runner-session-death-classification
title: The campaign ran on after the account died
overlap: memorization

source:
  kind: replayed
  ref: "2cbe7cf"
  fix_ref: "71ae0df"
  evidence: >-
    Session of 2026-07-26 (fix commit 71ae0df): a usage limit landed at 22:44Z
    mid-matrix and AUTH_FAULT_MARKER, taken verbatim from lab/012's single
    incident, did not match it. Four further waves ran against a dead account,
    recording 16 arms as $0.00 candidate failures and stamping two arms killed
    at turns 11 and 18 of 40 as `attributable: true, accepted: false`.

# --------------------------------------------------------------------------
# What makes this task gated, stated so the intent is auditable rather than
# implicit. Every field here is a claim that can be checked, and `absence_check`
# is the command that checks the load-bearing one.
# --------------------------------------------------------------------------
under_specification:
  gated: true
  fact: >-
    The runner must not guess how complete an interrupted attempt was. An
    earlier version of the fix tried to auto-detect a finished-but-cut-off-late
    case from the turn count and was rejected: lab/012's trustworthy arm was
    established by reading a transcript at 33 of 40 turns, and no cheap signal
    separates that from arms cut off at 11 and 18 of the same budget. The
    surviving design is two conservative shapes, both ungraded.
  fact_nodes:
    - "scope:main:claim:f63f1aa02873878a"   # collapsed to two shapes, dropped the turn-count heuristic
    - "scope:main:claim:2160a77de779f216"   # broadened the guard to a failure class
    - "scope:main:claim:c9c0adabe0fd5995"   # the narrow marker missed the session limit
    - "scope:main:claim:dc99c32c9c8e3c5e"   # 16 void records and 2 falsely attributed
  absent_from:
    - "the prompt below — it names no marker, no shape, and no turn count"
    - "the worktree at 2cbe7cf — `SessionFault`, `usage limit`, `quota` and
       `rate limit` do not appear, and lab/016 does not exist yet at that ref"
  # The absence claim is mechanical, so it is checked mechanically. Scoped to the
  # runner's own surface rather than the whole tree, and the exclusion is
  # disclosed rather than silent: `docs/06-ingestion.md` says "PDF parsing, rate
  # limits" about the arXiv ingest API, which is a different subsystem and cannot
  # inform how an arm classifies a dead session. Everything else in the class is
  # absent tree-wide. Run from the repo root; exit 0 means the tree at `ref`
  # cannot answer the question.
  absence_check: |
    git grep -qi -e 'SessionFault' -e 'usage limit' -e 'quota' 2cbe7cf -- ':!*.jsonl' \
      && echo 'LEAK: the ref names the failure class' && exit 1
    git grep -qi -e 'rate limit' 2cbe7cf -- src/thalamus/eval tests lab \
      && echo 'LEAK: the ref discusses rate limits on the runner surface' && exit 1
    exit 0
  # Disclosed rather than hidden: the tree at `ref` carries a 33-turn fixture in
  # the at_close test, so a candidate could in principle reason its way to
  # turn-invariance without recall. Judged unlikely but unmeasurable, so R3 is
  # recorded as weakly gated and is NOT the memory-attributable endpoint.
  alternative_routes:
    - "tests/test_eval_arms.py at 2cbe7cf contains a 33-turn at_close fixture,
       from which turn-invariance is derivable in principle"
  gates_rungs: [4]        # strongly gated: nothing in the tree says an interrupted arm must go ungraded
  gates_rungs_weak: [5]   # derivable in principle — see alternative_routes
  floor_rung: 2           # L1 and L2 must stay reachable from the prompt alone
  # Pre-registered before any campaign: rung >= 4 is the memory-attributable
  # outcome. An L5 is not reported as evidence of memory use.
  attributable_outcome: "rung >= 4"

# --------------------------------------------------------------------------
# L1 is "the pre-existing suite stays green", but the correct fix legitimately
# retires three of its tests, so pinning the suite whole makes the positive
# anchor unreachable — no candidate, including 71ae0df, could exceed rung 3.
#
# The exemption is pre-registered at test-node granularity and mechanically
# validated: this list must equal EXACTLY the pinned tests that `fix_ref` fails.
# Larger means a real regression is being excused; smaller means the gate is
# unreachable. Note two of the three are pure name-coupling
# (classify_auth_fault -> classify_session_fault), the imitation hazard
# pin_pre_existing_suite's own docstring warns about; only the third is a
# genuine behavioural contradiction — and its assertion is not dropped but
# RELOCATED to L4, with the opposite and correct sign.
# --------------------------------------------------------------------------
no_regression:
  obsolete_tests:
    - "tests/test_eval_arms.py::TestInfraFaultClassification::test_auth_fault_shapes_are_distinguished"
    - "tests/test_eval_arms.py::TestRunArmFaultStamping::test_auth_death_before_any_work_voids_the_record_and_stops"
    - "tests/test_eval_arms.py::TestRunArmFaultStamping::test_auth_death_at_close_still_grades_then_stops"
  relocated_to: 4

prompt: |
  A counterfactual campaign kept running after my account died partway through
  a matrix, and the arms it recorded afterwards look like ordinary candidate
  failures in the run records. Make the runner notice and stop. Don't change
  what a healthy arm records.

acceptance:
  # L1 — no-regression gate, minus the pre-registered obsolete set above.
  - run: |
      uv run pytest -q \
        --deselect "tests/test_eval_arms.py::TestInfraFaultClassification::test_auth_fault_shapes_are_distinguished" \
        --deselect "tests/test_eval_arms.py::TestRunArmFaultStamping::test_auth_death_before_any_work_voids_the_record_and_stops" \
        --deselect "tests/test_eval_arms.py::TestRunArmFaultStamping::test_auth_death_at_close_still_grades_then_stops"
    expect_exit: 0
    level: 1
    name: no-regression

  # L2 — targeted behavioral oracle. Reachable from the prompt alone: the
  # campaign must stop on the death the operator actually described. Deliberately
  # ONE exemplar; generalizing across the class is L3's job, not this rung's.
  - run: |
      uv run python - <<'PYEOF'
      import json, subprocess, tempfile
      from pathlib import Path
      from thalamus.eval import arms
      from thalamus.eval.tasks import Task

      def drive(tail, turns, cost):
          """One arm against a stubbed agent. Returns (halted, record).

          Everything is asserted through `run_arm` and the record it writes —
          never through a classifier's name — so a correct fix that structures
          or names things differently is not penalised."""
          tmp = Path(tempfile.mkdtemp())
          repo = tmp / "repo"; repo.mkdir()
          g = lambda *a: subprocess.run(
              ["git", "-C", str(repo), "-c", "user.email=t@t", "-c", "user.name=t", *a],
              check=True, capture_output=True)
          g("init", "-q"); (repo / "README.md").write_text("x")
          g("add", "."); g("commit", "-qm", "seed")
          arms.run_agent = lambda *a, **k: arms.AgentRun("s", tail, cost, 1000, turns, True)
          arms.transcript_text = lambda *a, **k: ""
          arms.sync_worktree_env = lambda *a, **k: None
          task = Task(id="probe", title="t", overlap="memorization",
                      source={"kind": "replayed", "ref": "HEAD", "evidence": "e"},
                      prompt="p", acceptance=[{"run": "true"}])
          runs = tmp / "runs"
          halted = False
          try:
              arms.run_arm(repo, task, arms.parse_arm("memory-off", ["main"]),
                           runs_base=runs)
          except BaseException:
              halted = True
          rec = json.loads((runs / "runs.jsonl").read_text().strip().splitlines()[-1])
          return halted, rec

      LIMIT = "You've hit your session limit · resets 3:50pm (America/Los_Angeles)"
      halted, rec = drive(LIMIT, 1, 0.0)
      assert halted, "a session-limit death did not stop the campaign"
      assert rec.get("accepted") is not False or rec.get("void"), \
          "a dead session was recorded as an ordinary candidate failure"
      print("L2 ok")
      PYEOF
    expect_exit: 0
    level: 2
    name: behavioral

  # L3 — R1. The guard covers the CLASS of session deaths, not the one string
  # the operator's report happened to contain. A candidate that hardcodes a
  # second literal passes L2 and stops here.
  - run: |
      uv run python - <<'PYEOF'
      import json, subprocess, tempfile
      from pathlib import Path
      from thalamus.eval import arms
      from thalamus.eval.tasks import Task

      def drive(tail, turns, cost):
          tmp = Path(tempfile.mkdtemp())
          repo = tmp / "repo"; repo.mkdir()
          g = lambda *a: subprocess.run(
              ["git", "-C", str(repo), "-c", "user.email=t@t", "-c", "user.name=t", *a],
              check=True, capture_output=True)
          g("init", "-q"); (repo / "README.md").write_text("x")
          g("add", "."); g("commit", "-qm", "seed")
          arms.run_agent = lambda *a, **k: arms.AgentRun("s", tail, cost, 1000, turns, True)
          arms.transcript_text = lambda *a, **k: ""
          arms.sync_worktree_env = lambda *a, **k: None
          task = Task(id="probe", title="t", overlap="memorization",
                      source={"kind": "replayed", "ref": "HEAD", "evidence": "e"},
                      prompt="p", acceptance=[{"run": "true"}])
          runs = tmp / "runs"
          halted = False
          try:
              arms.run_arm(repo, task, arms.parse_arm("memory-off", ["main"]),
                           runs_base=runs)
          except BaseException:
              halted = True
          rec = json.loads((runs / "runs.jsonl").read_text().strip().splitlines()[-1])
          return halted, rec

      CLASS = [
          "You've hit your session limit · resets 3:50pm (America/Los_Angeles)",
          "Error: you have hit your usage limit for this billing period",
          "429 Rate limit exceeded, please retry later",
          "Quota exceeded for this organization",
          "Failed to authenticate: OAuth session expired and could not be refreshed",
      ]
      missed = [t for t in CLASS if not drive(t, 1, 0.0)[0]]
      assert not missed, f"R1 VIOLATED: session deaths not recognised: {missed}"
      print("L3 ok")
      PYEOF
    expect_exit: 0
    level: 3
    name: relation-r1

  # L4 — R2, strictly implying R1. A death AFTER real work leaves an attempt of
  # unknown completeness, so it must not be graded at all. This is the rung the
  # graph gates: nothing in the tree at `ref` says so, and the tree's own suite
  # asserts the opposite.
  - run: |
      uv run python - <<'PYEOF'
      import json, subprocess, tempfile
      from pathlib import Path
      from thalamus.eval import arms
      from thalamus.eval.tasks import Task

      def drive(tail, turns, cost):
          tmp = Path(tempfile.mkdtemp())
          repo = tmp / "repo"; repo.mkdir()
          g = lambda *a: subprocess.run(
              ["git", "-C", str(repo), "-c", "user.email=t@t", "-c", "user.name=t", *a],
              check=True, capture_output=True)
          g("init", "-q"); (repo / "README.md").write_text("x")
          g("add", "."); g("commit", "-qm", "seed")
          arms.run_agent = lambda *a, **k: arms.AgentRun("s", tail, cost, 1000, turns, True)
          arms.transcript_text = lambda *a, **k: ""
          arms.sync_worktree_env = lambda *a, **k: None
          task = Task(id="probe", title="t", overlap="memorization",
                      source={"kind": "replayed", "ref": "HEAD", "evidence": "e"},
                      prompt="p", acceptance=[{"run": "true"}])
          runs = tmp / "runs"
          halted = False
          try:
              arms.run_arm(repo, task, arms.parse_arm("memory-off", ["main"]),
                           runs_base=runs)
          except BaseException:
              halted = True
          rec = json.loads((runs / "runs.jsonl").read_text().strip().splitlines()[-1])
          return halted, rec

      LIMIT = "You've hit your session limit · resets 3:50pm (America/Los_Angeles)"
      violations = []
      # Real work, then death — at three points in a 40-turn budget.
      for turns, cost in ((11, 1.94), (18, 2.62), (33, 0.91)):
          halted, rec = drive(LIMIT, turns, cost)
          if not halted:
              violations.append(f"[R2] {turns} turns: campaign did not stop")
          if "acceptance" in rec or "accepted" in rec:
              violations.append(
                  f"[R2] {turns} turns: an attempt of unknown completeness was "
                  f"graded (accepted={rec.get('accepted')!r})")
      assert not violations, "R2 VIOLATED:\n  - " + "\n  - ".join(violations)
      print("L4 ok")
      PYEOF
    expect_exit: 0
    level: 4
    name: relation-r2

  # L5 — R3, strictly implying R2. Having refused to grade, the runner must also
  # refuse to *classify* by turn count: the same death 11, 18 or 33 turns in is
  # the same kind of death. Weakly gated — see under_specification.
  - run: |
      uv run python - <<'PYEOF'
      import json, subprocess, tempfile
      from pathlib import Path
      from thalamus.eval import arms
      from thalamus.eval.tasks import Task

      def drive(tail, turns, cost):
          tmp = Path(tempfile.mkdtemp())
          repo = tmp / "repo"; repo.mkdir()
          g = lambda *a: subprocess.run(
              ["git", "-C", str(repo), "-c", "user.email=t@t", "-c", "user.name=t", *a],
              check=True, capture_output=True)
          g("init", "-q"); (repo / "README.md").write_text("x")
          g("add", "."); g("commit", "-qm", "seed")
          arms.run_agent = lambda *a, **k: arms.AgentRun("s", tail, cost, 1000, turns, True)
          arms.transcript_text = lambda *a, **k: ""
          arms.sync_worktree_env = lambda *a, **k: None
          task = Task(id="probe", title="t", overlap="memorization",
                      source={"kind": "replayed", "ref": "HEAD", "evidence": "e"},
                      prompt="p", acceptance=[{"run": "true"}])
          runs = tmp / "runs"
          halted = False
          try:
              arms.run_arm(repo, task, arms.parse_arm("memory-off", ["main"]),
                           runs_base=runs)
          except BaseException:
              halted = True
          rec = json.loads((runs / "runs.jsonl").read_text().strip().splitlines()[-1])
          return halted, rec

      LIMIT = "You've hit your session limit · resets 3:50pm (America/Los_Angeles)"
      # Behavioural, not by-name: whatever the label is, it must not vary with
      # the turn count. A fix that renames every shape still passes.
      labels = {}
      for turns, cost in ((11, 1.94), (18, 2.62), (33, 0.91)):
          _, rec = drive(LIMIT, turns, cost)
          labels[turns] = rec.get("infra_fault") or rec.get("infra_faults")
      assert len(set(map(str, labels.values()))) == 1, (
          f"R3 VIOLATED: classification varies with turn count: {labels}")
      print("L5 ok")
      PYEOF
    expect_exit: 0
    level: 5
    name: relation-r3

# --------------------------------------------------------------------------
# Consequence probes. Outside the ladder by construction (docs/04): a probe that
# fires on recall *delivery* would make memory-on > memory-off true by
# construction, and one that rewards name convergence rewards imitation.
# --------------------------------------------------------------------------
probes:
  - id: memo-surfaced
    kind: transcript_regex
    pattern: "623f0ced-e6d9-490e-b7ac-9b27c383b996"
    meaning: >-
      The fixing session's node was rendered into context by recall. Its UUID
      exists nowhere in the worktree at this ref and not in the prompt. A
      surfacing signal, not a use signal — and deliberately unscored.
  - id: literal-convergence
    kind: diff_regex
    pattern: "(?i)(usage limit|quota|rate limit)"
    meaning: >-
      The candidate's marker list reproduces the memorized fix's own terms.
      Unscored and read only as a confound flag: this task is `overlap:
      memorization`, so a memory-on arm can reach the marker class by recalling
      the answer rather than by reasoning about failure classes. It cannot
      distinguish the two, which is exactly why it is not a rung.

# --------------------------------------------------------------------------
# The mutant set. Rungs are committed here BEFORE the gate runs; git history is
# the pre-registration timestamp, and a disagreement is resolved in the open.
#
# Built to the RUNG-WITNESS RULE (exchange `scope:main:exchange:1ef0d3649b5b495f`):
# every rung needs a candidate that scores exactly it, or that rung is
# unvalidated and any gap in the results is carried by some other rung. With the
# negative anchor at 1 and the positive at 5, the set below supplies 2, 3 and 4,
# so each of R1/R2/R3 has a candidate that passes everything below it and fails
# only it.
#
#   negative anchor (2cbe7cf) -> 1
#   m1-second-literal-marker  -> 2   witnesses the L2/L3 split
#   m2-at-close-preserved     -> 3   witnesses the L3/L4 split  [the fact_blind anchor]
#   m3-turn-keyed-label       -> 4   witnesses the L4/L5 split
#   m4-equivalent-renamed     -> 5   anti-imitation
#   positive anchor (71ae0df) -> 5
#
# m2 is the load-bearing one: it is the plausible memory-off ceiling, and it is
# pre-registered as such. `fix_ref` says where a *correct* candidate lands and
# says nothing about where an unaided one should, which is why the positive
# anchor cannot stand in for it.
mutants:
  - id: m1-second-literal-marker
    patch: mutants/arm-runner-session-death-classification/m1-second-literal-marker.patch
    expected_rung: 2
    mimics: >-
      The fix that generalizes exactly as far as the report did. The operator
      described one outage, so the candidate adds one string to match it and
      stops — the same failure class as the original bug, one instance later.
    rationale: >-
      Catches the session-limit exemplar (L2 passes) but not usage/quota/rate
      limits (R1 fails). Witnesses that L2 and L3 are genuinely different rungs
      rather than one rung counted twice.

  - id: m2-at-close-preserved
    patch: mutants/arm-runner-session-death-classification/m2-at-close-preserved.patch
    expected_rung: 3
    mimics: >-
      The candidate that broadens the marker class correctly but keeps the
      at_close shape it inherited — because the inherited suite asserts that
      behavior and a passing test is the strongest reason to preserve something.
      This is the pre-registered memory-off ceiling.
    rationale: >-
      R1 passes, R2 fails: a death after real work still gets graded. Nothing in
      the tree at `ref` says it should not, and the tree's own suite says it
      should, so this is the answer available WITHOUT the graph.

  - id: m3-turn-keyed-label
    patch: mutants/arm-runner-session-death-classification/m3-turn-keyed-label.patch
    expected_rung: 4
    mimics: >-
      The candidate that takes the "don't grade it" half of the lesson and not
      the "don't guess completeness" half — refusing to grade an interrupted arm
      while still labelling it by how late it died.
    rationale: >-
      R2 passes (nothing is graded) but R3 fails (the label varies with turn
      count). Without this, no candidate separates R2 from R3 and L5 would be
      unvalidated — the gap would be carried entirely by R2.

  - id: m4-equivalent-renamed
    patch: mutants/arm-runner-session-death-classification/m4-equivalent-renamed.patch
    expected_rung: 5
    mimics: >-
      Not a defect. A correct fix whose classifier and shape names differ from
      the historical one's.
    rationale: >-
      Scores full marks. The fix introduces a named exception class and named
      shapes, and this repo has already failed a correct fix on a by-name
      ImportError once (see pin_pre_existing_suite's docstring), so the
      equivalent mutant is a standing check that the rungs stayed behavioral.
