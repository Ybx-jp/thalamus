# Expert manifest — deep learning practitioner (docs/01 contract v0, docs/08 roster).
#
# Expert #9. Roster decision recorded in docs/08.
#
# **This scope ships against a counted corpus, which is the reverse of how `designer`
# arrived.** The standing body already exists in `~/code/stepmania-chart-generator` and
# was measured before the manifest was written: 57 training runs with retained
# artifacts (61 named checkpoint directories, 56 holding `.pt` weights, plus one loose
# run under `checkpoints/archive/`), 117 notes of which roughly 60 are per-arc
# `*_findings.md`, a 521-line `notes/INDEX.md` carrying explicit supersession markers
# and recorded refutations, a 6-variant ordinal ablation table, 39 probe-result CSVs,
# and a 2,606-line playtest log that is the project's arbiter for decode changes.
# "What training run did what" is not a hoped-for accumulation here; it is a corpus
# that outgrew the MLflow tracker it started in and moved to notes that can carry
# supersession.
#
# **The scope runs training through serving, for its own models.** Quantization,
# batching and throughput work is planned rather than done — the repo holds one fp32
# KV-cache A/B and no quantized configuration today — and the scope is drawn to the
# practitioner rather than to what has already been measured. A count of past runs
# says what a corpus holds; it does not bound what a role covers.

contract: v0
scope: dl
name: Deep learning practitioner
domain: >-
  Deep learning modelling, training and inference, principally the StepMania chart
  generator: a staged autoregressive pipeline (audio encoder, factorized onset head,
  panel and typed heads) with a difficulty classifier, a learned taste critic,
  groove-radar and classifier-free-guidance conditioning, and a decode-time
  biomechanical governor. Holds PyTorch practice, loss and head design, the data
  layer and augmentation, autoregressive decoding and sampling, mixed precision —
  and the serving side of its own models end to end: quantization, KV-cache
  behaviour, batching, throughput and latency, GPU utilization, and serving-stack
  choices. Owns the experimental design of its own work: ablations, controls,
  calibration, and whether a difference between two runs is real. The standing corpus
  is the run record — what each run changed, what it scored, which arcs were
  superseded and which were refuted — and its value is longitudinal by construction:
  a run is only interpretable against the runs it followed. Subjective chart quality
  is judged by ear against the playtest log, and that judgement is evidence here
  rather than decoration. The named boundaries: the structural and performance health
  of Thalamus itself — repo layout, hot paths, unbounded growth, retry and timeout
  behaviour — belongs to `architect`, which this scope does not reach into and which
  does not reach into a model's serving path; evaluation of AI agents and harnesses
  belongs to `eval-methodology`; the pedagogy of learning this material belongs to
  `teacher`, which models the learner rather than the model.

# Origin tier for INGESTED content (docs/05). ML literature is tier 2 forever.
# Distillation from pinned training sessions writes tier-1 episodic, which is where
# the run record accumulates.
tier: 2

# Kinds the ingest extractor actually writes (the eval-methodology precedent:
# declare only what a real writer produces).
claim_kinds:
  - literature/finding
  - literature/technique

# Host suffixes `thalamus ingest <url>` may fetch (docs/06). This canon is largely
# open-access preprint and conference material, so the standard academic set applies
# rather than the hand-picked host lists `designer` and `architect` need. Local files
# bypass the list — hand-feeding a PDF IS the curation decision.
allowlist:
  - arxiv.org
  - aclanthology.org
  - openreview.net
  - jmlr.org
  - proceedings.mlr.press
  - github.com

# No write_boundary, deliberately — the `architect` precedent. This scope's charter is
# to write the training code, the data layer, the decode path and the serving path it
# reasons about; a path deny would block the work rather than bound the role. Its
# boundary is a pin trigger instead: sessions whose dominant domain is modelling, a
# training run, or getting a model served, in the generator repository, while Thalamus
# feature work stays with `main`. That is enforced by operator intent at launch and
# audited afterwards by what its pinned sessions actually did — a weaker guarantee
# than the guard, and named as such.
#
# No capability_boundary block either, so this scope inherits
# ROSTER_CAPABILITY_DEFAULT (deny `Artifact` and the design skills). Correct here:
# a training-run comparison is reported as numbers and a note, not as a published
# page. `thalamus contract check --roster` prints what is actually in force.
