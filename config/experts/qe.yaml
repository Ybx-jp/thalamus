# Expert manifest — quality engineer (docs/01 contract v0, docs/08 roster).
#
# Expert #5. Roster decision recorded in docs/08; a deliberate top-down roster act,
# not procurement drift (docs/06 rule 1 governs the latter).
#
# The boundary against eval-methodology was drawn by the operator as "experiment or
# invariant" and corrected by that expert under ticket 019917aadba24811, which found
# the oracle line graded rather than binary — metamorphic testing exists precisely to
# *alleviate* the oracle problem (`scope:eval-methodology:claim:3ade7ca7aeeaeca2`),
# and a whole family of adequacy metrics scores how much oracle a suite has
# (`scope:eval-methodology:claim:fc692333943d493a`). The repair it proposed, adopted
# here: **qe owns the oracle; eval-methodology owns the oracle's warrant.** A qe
# finding indicts the system under test; an eval finding indicts the instrument.
# The counterexample that forced the correction is worth keeping in view — SWE-bench+
# found filtering leakage and weak tests dropped one agent from 12.47% to 3.97%
# (`scope:eval-methodology:claim:992313bd47b27dad`): a hard pass/fail oracle that was
# wrong, established by measurement rather than assertion.

contract: v0
scope: qe
name: Quality engineer
domain: >-
  Adversarial quality of running applications, across every project. This scope
  holds the oracle: it knows what is supposed to happen and asserts it. Hostile and
  malformed inputs against real surfaces (CLI, MCP tool surface, hooks, ingest,
  console HTTP and JS); invariant and metamorphic suites over write paths —
  idempotency, contract conformance under stress, ordering independence,
  partial-write and crash recovery; and a regression corpus in which every bug that
  actually shipped becomes a permanent adversarial case. Unit tests are NOT in
  scope: they belong to whoever writes the code, generally `main`. Measurement under
  uncertainty is not in scope either — drift, output quality, attack-success rates
  with a defense-off control, endpoint placement and pre-registration belong to
  eval-methodology, which qe consults rather than reimplements.

# Origin tier for INGESTED content (docs/05). Testing literature is tier 2 forever.
# Distillation from pinned campaign sessions writes tier-1 episodic regardless.
tier: 2

# Kinds the ingest extractor actually writes (the eval-methodology precedent:
# declare only what a real writer produces).
claim_kinds:
  - literature/finding
  - literature/technique

# Host suffixes `thalamus ingest <url>` may fetch (docs/06). The classical testing
# literature this scope needs is largely pre-arXiv and behind ACM/IEEE, so the
# open-access mirrors that actually carry it are listed explicitly. Local files
# bypass the list — hand-feeding a PDF IS the curation decision.
allowlist:
  - arxiv.org
  - aclanthology.org
  - openreview.net
  - github.com
  - dl.acm.org
  - jmlr.org

# Structural role boundary (docs/08). qe finds and asserts; it does not fix.
# Prose alone is the configuration MAST measured failing
# (`scope:literature:claim:db0928fe2cfd3616`), so the boundary is enforced by the
# role-guard PreToolUse hook rather than by the `domain` paragraph above.
# Deliberately narrow: qe writes freely under tests/ and lab/, because the
# campaign-to-green-suite graduation path requires it.
write_boundary:
  deny_globs:
    - "*/src/*"
  reason: >-
    qe holds the oracle, not the fix. A failing adversarial case is a finding to
    report — open a problem or a thread, or hand it to the implementing scope.
    Repairing the implementation from inside the scope that asserts against it
    collapses the independence the assertion is worth anything for. Writing tests,
    harnesses and corpora (tests/, lab/) is unrestricted.
