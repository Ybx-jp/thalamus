# Expert manifest — code advisor.
#
# Structurally the unusual one: it carries **no write boundary**, because
# its role is to write the changes it proposes. Its boundary is a pin trigger
# instead — campaign sessions only (reorganization, a measured performance fix, a
# reliability hardening pass), while feature work stays with `main` and consults
# this scope. That makes it the roster's clearest test of whether a boundary that
# lives in when-you-pin can hold as well as one that lives in what-you-may-write.

contract: v0
scope: architect
name: Code advisor
domain: >-
  The organizational and architectural health of the codebases, and their
  performance and reliability. Standing structural memory is the point: where the
  seams are, which abstractions leaked, which refactors were tried and rejected and
  why — the accumulation a single session's context cannot hold. Performance and
  reliability hunting with measurement attached: hot paths, unbounded growth, retry
  and timeout behavior, before-and-after numbers rather than assertions of
  improvement. Judgement is portable across projects; structural depth is per-repo.
  Writes its own changes in pinned campaign sessions, and is consulted from feature
  sessions rather than pinned for them. Where a structural property should hold
  permanently and be checked, that is an invariant and belongs with the test suite
  rather than here. A model's own training, decode and serving path — its
  quantization, KV-cache, batching and throughput — is out of scope; what remains
  here on a shared box is contention and the host, which is the resource a number
  was taken under rather than the model that produced it.

# Origin tier for INGESTED content. Architecture literature is tier 2
# forever. Distillation from pinned campaign sessions writes tier-1 episodic.
tier: 2

claim_kinds:
  - literature/finding
  - literature/technique

# Host suffixes `thalamus ingest <url>` may fetch. The load-bearing
# architecture canon (Parnas 1972, Conway 1968, the modularity-metric work) predates
# arXiv and lives on author and university mirrors, so the specific open-access
# hosts carrying the anchors are listed rather than a broad suffix. Local files
# bypass the list — hand-feeding a PDF IS the curation decision.
allowlist:
  - arxiv.org
  - sre.google
  - dl.acm.org
  - github.com
  - hbs.edu
  - melconway.com
  # Provenance and approval-record canon, procured against the thread-close design:
  # what a close writes when no session performed it, and who is recorded as having
  # approved it. PROV-O is the anchor — its Activity/Agent/wasAssociatedWith
  # vocabulary is the entity set the rest converge on.
  - w3.org
  - gerritcodereview.com
  - docs.datomic.com
  - docs.temporal.io
  # Performance-measurement canon, procured against the growth instrument. Both hosts
  # carry a specific paper the allowlisted ones do not: Dapper (the span record, and
  # the sampling argument that decides what a trace may cost) lives only in Google's
  # own archive, and Garg/Trivedi's software-aging methodology — the one method in
  # this literature native to n=1, single-machine measurement, which is exactly this
  # system's shape — is free full text only in NC State's repository.
  - research.google.com
  - repository.lib.ncsu.edu
  # Provenance-fidelity canon, procured against the run-record instrument: whether a
  # sha256 sidecar over a finished VM image is a sufficient fingerprint, or the record
  # needs a fuller attestation, a step-chain, source-level reproducibility, a
  # content-addressed derivation model, materials/parameters separation, or a
  # snapshot/restore alternative. SLSA and in-toto's own USENIX paper carry the
  # attestation and link-file formats; reproducible-builds.org carries the
  # bit-reproducibility discipline SOURCE_DATE_EPOCH argues from; Dolstra's LISA 2004
  # paper is the content-addressed-derivation anchor; DVC's docs are the clearest
  # single statement of pinned-materials-vs-per-run-params; the Firecracker NSDI paper
  # is the snapshot/restore alternative; libguestfs's own manual pages are the only
  # source for virt-copy-in/-out's documented behaviour and throughput.
  - slsa.dev
  - usenix.org
  - reproducible-builds.org
  - edolstra.github.io
  - doc.dvc.org
  - libguestfs.org

# No write_boundary, deliberately. This scope's charter is to perform the
# reorganizations and fixes it identifies; a path deny would block the work rather
# than bound a role. The boundary that governs it is the pin trigger — campaign
# sessions only — enforced by operator intent at launch and audited afterwards by
# what its pinned sessions actually did — a weaker guarantee than the guard, and
# named as such rather than papered over.
