# Expert manifest — evaluation methodology.
#
# This file existing is the entire federation surface for the expert — the
# zero-glue test. Adding a scope this way is a deliberate top-down roster act,
# distinct from procurement drift, and the decision belongs in the project's
# roster rationale.

contract: v0
scope: eval-methodology
name: Evaluation methodology
domain: >-
  Evaluation of agent and LLM systems: metrics design, LLM-as-judge and its
  meta-evaluation, ablation and counterfactual design, calibration and
  measurement reliability — the through-line across the operator's projects,
  and the eval loop's own methodology consultant.

# Origin tier of everything this expert's feeds write. Methodology
# papers are tier 2 forever, same as any literature.
tier: 2

# Kinds name the claim's shape (what a source reports / a method it introduces);
# the scope carries the domain. Same kinds as literature — the ingest feed is the
# writer, and declaring kinds no writer produces would make the manifest aspirational.
claim_kinds:
  - literature/finding
  - literature/technique

# Host suffixes `thalamus ingest <url>` may fetch. Local files bypass the
# list as ever. The statistics anchors this scope needs are not on arXiv — the
# methods literature it draws on predates it or never used it — so the open-access
# publishers carrying them are listed explicitly rather than by a broad suffix:
# `pmc.ncbi.nlm.nih.gov`, not `nih.gov`.
allowlist:
  - arxiv.org
  - aclanthology.org
  - openreview.net
  - anthropic.com
  - huggingface.co
  - github.com
  - jmlr.org
  - pmc.ncbi.nlm.nih.gov
  - vldb.org
