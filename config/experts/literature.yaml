# Expert manifest — technical literature.
#
# This file IS the federation surface: a second expert is another file beside it
# and nothing else. It is tier-0 operator configuration — curation decisions live
# in git, not in the graph.

contract: v0
scope: literature
name: Technical literature
domain: >-
  Agent memory and evaluation, RAG and retrieval, harness engineering,
  audio/music ML — the literatures feeding active projects.

# Origin tier of everything this expert's feeds write. A brilliant
# paper is tier 2 forever.
tier: 2

claim_kinds:
  - literature/finding # what a source reports or demonstrates
  - literature/technique # a method the source introduces or evaluates

# Host suffixes `thalamus ingest <url>` may fetch. Operator-maintained; short on
# purpose — manual curation is tier-2 trust in practice. Local files
# bypass this list: hand-feeding a file is itself the curation decision.
allowlist:
  - arxiv.org
  - substack.com
  - aclanthology.org
  - openreview.net
  - anthropic.com
  - transformer-circuits.pub
  - huggingface.co
  - github.com
  # Pre-arXiv IR classics live on their authors' faculty pages and nowhere else the
  # list already reaches. Host-scoped rather than whole-university, since the claim
  # being approved is "this author's own copy", not "anything at this university".
  - cs.princeton.edu
  - cs.cmu.edu
