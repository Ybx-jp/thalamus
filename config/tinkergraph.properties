# TinkerGraph — the Thalamus substrate.
#
# ANY id managers are mandatory, not stylistic: Thalamus mints its own vertex IDs
# as scope-qualified strings (`scope:main:claim:<hash>`, see contract/ontology.py
# `vid()`), and the default LONG manager would reject every one of them.
gremlin.graph=org.apache.tinkerpop.gremlin.tinkergraph.structure.TinkerGraph
gremlin.tinkergraph.vertexIdManager=ANY
gremlin.tinkergraph.edgeIdManager=ANY
gremlin.tinkergraph.vertexPropertyIdManager=ANY

# Persistence. TinkerGraph is an in-memory graph that loads `graphLocation` at
# startup and writes it back on a clean shutdown — a hard kill loses everything
# since the last close. `thalamus snapshot` closes that window by calling the
# io()-step against this same path on demand; the write CLI calls it after every
# successful session write.
#
# gryo (not graphson) because it round-trips property types exactly. GraphSON
# loses the type of an identifier on the way out and reloads it as the wrong
# one, which surfaces much later as "Vertex with id already exists".
gremlin.tinkergraph.graphFormat=gryo
gremlin.tinkergraph.graphLocation=/opt/gremlin-server/data/thalamus-graph.kryo
