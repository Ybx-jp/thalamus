<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="790" viewBox="0 0 1020 790" role="img" aria-labelledby="mapTitle mapDesc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="mapTitle">The map: what I lived is mine, what I read is ours, and a ticket trades ours for yours</title>
  <desc id="mapDesc">A session is pinned to one scope, fixed when the process starts; no memory tool takes a scope argument. Reads split three ways. Episodic memory — your own sessions, threads and the claims inside them — is filtered to your pinned scope alone. Knowledge — claims and text chunks distilled from ingested documents, which sit inside no session — is read ambiently by every scope with no ticket. A consultation ticket grants one other expert's memory in full including its sessions, but drops the shared knowledge commons, so it buys depth by giving up breadth. The dividing line is the CONTAINS edge: a claim inside a session was lived, a claim in no session was read.</desc>

  <rect x="0" y="0" width="1020" height="790" fill="#f7f7f5"/>
  <rect x="0.5" y="0.5" width="1019" height="789" fill="none" stroke="#dcdcd6"/>

  <text x="44" y="58" font-size="30" font-weight="600" fill="#1f2328">The map</text>
  <text x="44" y="86" font-size="15.5" fill="#57606a">What I lived is mine. What I read is ours. A ticket trades ours for yours.</text>
  <line x1="44" y1="106" x2="976" y2="106" stroke="#e2e2dc" stroke-width="1"/>

  <!-- ============ the pin ============ -->
  <rect x="44" y="126" width="932" height="76" rx="10" fill="#ffffff" stroke="#cfcfc8"/>
  <text x="66" y="150" font-size="13.5" font-weight="600" fill="#1f2328">A session is pinned to exactly one scope.</text>

  <rect x="66" y="162" width="50" height="26" rx="5" fill="#eeeeea" stroke="#cfcfc8"/>
  <text x="91" y="179" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#57606a" text-anchor="middle">main</text>
  <rect x="126" y="162" width="86" height="26" rx="5" fill="#eeeeea" stroke="#cfcfc8"/>
  <text x="169" y="179" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#57606a" text-anchor="middle">architect</text>
  <rect x="222" y="162" width="82" height="26" rx="5" fill="#1f2328" stroke="#1f2328"/>
  <text x="263" y="179" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ffffff" text-anchor="middle">designer</text>
  <rect x="314" y="162" width="140" height="26" rx="5" fill="#eeeeea" stroke="#cfcfc8"/>
  <text x="384" y="179" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#57606a" text-anchor="middle">eval-methodology</text>
  <rect x="464" y="162" width="76" height="26" rx="5" fill="#eeeeea" stroke="#cfcfc8"/>
  <text x="502" y="179" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#57606a" text-anchor="middle">homelab</text>
  <rect x="550" y="162" width="94" height="26" rx="5" fill="#eeeeea" stroke="#cfcfc8"/>
  <text x="597" y="179" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#57606a" text-anchor="middle">literature</text>
  <rect x="654" y="162" width="40" height="26" rx="5" fill="#eeeeea" stroke="#cfcfc8"/>
  <text x="674" y="179" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#57606a" text-anchor="middle">qe</text>
  <rect x="704" y="162" width="76" height="26" rx="5" fill="#eeeeea" stroke="#cfcfc8"/>
  <text x="742" y="179" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#57606a" text-anchor="middle">teacher</text>

  <text x="798" y="150" font-size="11" fill="#57606a">The pin is the process: the</text>
  <text x="798" y="164" font-size="11" fill="#57606a">scope is settled when the</text>
  <text x="798" y="178" font-size="11" fill="#57606a">session starts, and no memory</text>
  <text x="798" y="192" font-size="11" fill="#57606a">tool takes a scope argument.</text>

  <text x="44" y="228" font-size="13" fill="#57606a">Being pinned splits what you can read into three, and the split is sharper than &#8220;each expert has its own memory&#8221;:</text>

  <!-- ============ panel 1 : episodic ============ -->
  <rect x="44" y="248" width="296" height="330" rx="10" fill="#ffffff" stroke="#cfcfc8"/>
  <rect x="44" y="248" width="296" height="5" rx="2.5" fill="#1f2328"/>
  <text x="66" y="284" font-size="16.5" font-weight="600" fill="#1f2328">What I lived is mine</text>
  <text x="66" y="304" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#57606a">EPISODIC MEMORY</text>
  <text x="66" y="332" font-size="12.5" fill="#1f2328">Your own past sessions, the threads</text>
  <text x="66" y="350" font-size="12.5" fill="#1f2328">left open in them, and the claims</text>
  <text x="66" y="368" font-size="12.5" fill="#1f2328">recorded inside those sessions.</text>
  <rect x="66" y="384" width="252" height="30" rx="5" fill="#eeeeea" stroke="#cfcfc8"/>
  <text x="78" y="404" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">.has(&quot;scope&quot;, &quot;designer&quot;)</text>
  <text x="66" y="440" font-size="12.5" fill="#57606a">Every read is filtered to the scope</text>
  <text x="66" y="458" font-size="12.5" fill="#57606a">you are pinned to. Another expert&#8217;s</text>
  <text x="66" y="476" font-size="12.5" fill="#57606a">session history is not reachable from</text>
  <text x="66" y="494" font-size="12.5" fill="#57606a">here at all.</text>
  <text x="66" y="526" font-size="12.5" font-weight="600" fill="#1f2328">Searching harder does not help.</text>
  <text x="66" y="544" font-size="12.5" fill="#57606a">It is a filter, not a ranking.</text>

  <!-- ============ panel 2 : knowledge ============ -->
  <rect x="362" y="248" width="296" height="330" rx="10" fill="#ffffff" stroke="#cfcfc8"/>
  <rect x="362" y="248" width="296" height="5" rx="2.5" fill="#1f2328"/>
  <text x="384" y="284" font-size="16.5" font-weight="600" fill="#1f2328">What I read is ours</text>
  <text x="384" y="304" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#57606a">SHARED KNOWLEDGE</text>
  <text x="384" y="332" font-size="12.5" fill="#1f2328">Claims and passages distilled from</text>
  <text x="384" y="350" font-size="12.5" fill="#1f2328">documents somebody ingested. They</text>
  <text x="384" y="368" font-size="12.5" fill="#1f2328">sit inside no session.</text>
  <rect x="384" y="384" width="252" height="30" rx="5" fill="#eeeeea" stroke="#cfcfc8"/>
  <text x="396" y="404" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">.not_(in_e(&quot;CONTAINS&quot;))</text>
  <text x="384" y="440" font-size="12.5" font-weight="600" fill="#1f2328">Every scope reads all of it.</text>
  <text x="384" y="458" font-size="12.5" fill="#57606a">Ambiently, with no ticket and nothing</text>
  <text x="384" y="476" font-size="12.5" fill="#57606a">requested &#8212; it arrives in an ordinary</text>
  <text x="384" y="494" font-size="12.5" fill="#57606a">recall, on by default.</text>
  <text x="384" y="526" font-size="12.5" fill="#1f2328">This is also how outside text reaches</text>
  <text x="384" y="544" font-size="12.5" fill="#1f2328">you, which the next picture is about.</text>

  <!-- ============ panel 3 : ticket ============ -->
  <rect x="680" y="248" width="296" height="330" rx="10" fill="#ffffff" stroke="#cfcfc8"/>
  <rect x="680" y="248" width="296" height="5" rx="2.5" fill="#1f2328"/>
  <text x="702" y="284" font-size="16.5" font-weight="600" fill="#1f2328">A ticket trades ours for yours</text>
  <text x="702" y="304" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#57606a">CONSULTATION</text>
  <rect x="702" y="318" width="252" height="30" rx="5" fill="#eeeeea" stroke="#cfcfc8"/>
  <text x="714" y="338" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">consult_request(expert=&#8230;)</text>

  <text x="702" y="374" font-size="13" font-weight="600" fill="#1f2328">+</text>
  <text x="720" y="374" font-size="12.5" font-weight="600" fill="#1f2328">You gain that one expert in full &#8212;</text>
  <text x="720" y="392" font-size="12.5" font-weight="600" fill="#1f2328">its sessions included.</text>

  <text x="702" y="422" font-size="13" font-weight="600" fill="#1f2328">&#8722;</text>
  <text x="720" y="422" font-size="12.5" font-weight="600" fill="#1f2328">You lose the shared knowledge.</text>
  <text x="720" y="440" font-size="12.5" fill="#57606a">Under a ticket, a recall returns that</text>
  <text x="720" y="458" font-size="12.5" fill="#57606a">one scope and nothing else.</text>

  <text x="702" y="494" font-size="12.5" fill="#57606a">So it is not a door onto everything.</text>
  <text x="702" y="512" font-size="12.5" font-weight="600" fill="#1f2328">A consultation buys depth by</text>
  <text x="702" y="530" font-size="12.5" font-weight="600" fill="#1f2328">giving up breadth.</text>
  <text x="702" y="556" font-size="11.5" fill="#57606a">Asking is also recorded: the ticket is the</text>
  <text x="702" y="571" font-size="11.5" fill="#57606a">exchange, written when you mint it.</text>

  <!-- ============ the seam ============ -->
  <rect x="44" y="598" width="932" height="164" rx="10" fill="#ffffff" stroke="#cfcfc8"/>
  <text x="66" y="628" font-size="16.5" font-weight="600" fill="#1f2328">The line is not drawn between the scopes. It is drawn by one edge.</text>
  <rect x="66" y="644" width="104" height="26" rx="5" fill="#eeeeea" stroke="#cfcfc8"/>
  <text x="118" y="661" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328" text-anchor="middle">CONTAINS</text>
  <text x="190" y="655" font-size="12.5" fill="#1f2328">A claim <tspan font-weight="600">inside</tspan> a session is something this agent lived through: episodic, and yours alone.</text>
  <text x="190" y="673" font-size="12.5" fill="#1f2328">A claim in <tspan font-weight="600">no</tspan> session is something it read: knowledge, and shared with every scope.</text>
  <text x="66" y="700" font-size="12" fill="#57606a">Same graph, same kind of record, same query. Whether one edge exists decides who may see it.</text>
  <line x1="66" y1="716" x2="954" y2="716" stroke="#e2e2dc"/>
  <text x="66" y="736" font-size="13.5" font-weight="600" fill="#1f2328">So before you mint a ticket, ask: is it a claim they wrote down, or is it what they did?</text>
  <text x="66" y="754" font-size="12.5" fill="#1f2328">If it is a claim you can already read it: call <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">memory_recall</tspan> and mint nothing. Only what they lived needs the ticket.</text>
</svg>
