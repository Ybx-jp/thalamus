[project]
name = "thalamus-ingest"
dynamic = ["version"]
description = "Curated ingestion for thalamus: third-party documents into an expert's knowledge subgraph"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jackson Porter" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # The floor is the first core with the `thalamus` entry-point group; an older core
    # installs this package and never loads it.
    "thalamus-memory>=0.1.1.dev0",
    # A required dependency rather than an extra: PDF is the only format ICSE, CHI, FSE
    # and TSE publish, and pypdf is pure Python with no native build.
    "pypdf>=5.0",
]

[project.urls]
Homepage = "https://github.com/Ybx-jp/thalamus"
Repository = "https://github.com/Ybx-jp/thalamus"
Issues = "https://github.com/Ybx-jp/thalamus/issues"

[project.entry-points.thalamus]
ingest = "thalamus_ingest.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/thalamus_ingest/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus_ingest"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md"]

[tool.uv.sources]
thalamus-memory = { workspace = true }
