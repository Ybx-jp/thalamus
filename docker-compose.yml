# The graph server, for `docker compose up -d` from a clone. Its compose file ships in
# the package (src/thalamus/graph/), where an installed wheel's `thalamus graph up`
# finds it; this includes it, and Compose resolves its mounts relative to that file.
#
# `name` is restated because a project's name comes from the top-level file, and with
# it the data volume's: `thalamus_thalamus-graph-data`, the same from a clone, a
# worktree or a wheel.
name: thalamus

include:
  - src/thalamus/graph/docker-compose.yml
