name: thalamus

services:
  graph:
    image: tinkerpop/gremlin-server:3.7.3
    restart: unless-stopped
    # SIGTERM makes TinkerGraph flush graphLocation on the way out. Give the JVM
    # room to finish that write rather than letting compose SIGKILL it at 10s.
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:8182:8182"
    volumes:
      - ./config:/opt/gremlin-server/conf/thalamus:ro
      # The graph file lives here. Mounted on the image's own data directory so
      # the named volume inherits the `gremlin` uid that the server runs as.
      - thalamus-graph-data:/opt/gremlin-server/data
    # Bypasses the image entrypoint on purpose. That script `sed -i`s the config
    # to pin `host:` to the container IP, which fails against a read-only mount
    # and would otherwise dirty a tracked file. `host: 0.0.0.0` in the yaml binds
    # every interface, which is what the substitution was approximating.
    entrypoint: ["/opt/gremlin-server/bin/gremlin-server.sh"]
    command: ["conf/thalamus/gremlin-server.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8182"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  thalamus-graph-data:
