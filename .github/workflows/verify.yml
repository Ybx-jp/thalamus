# The commands CLAUDE.md names as the verification discipline, gated.
#
# The rule this file exists to enforce: an instrument with no trigger reports to
# nobody. Every check here was once a command an operator had to remember to type, and
# each one drifted while nobody typed it — lint errors on master, a structural model
# measuring a commit 25 behind HEAD. A check that cannot fail a build is documentation.
#
# It stays separate from `qe-fast.yml` on purpose. The qe tier deliberately carries
# entries that are supposed to be red and is not shipped in the wheel; merging the two
# suites would make each one's exit code mean the other's thing.
#
# `contract check` needs a reachable graph, so this brings up the real compose file
# rather than a service container — the compose file is the thing a first-time user
# runs, and its healthcheck is the readiness signal, so exercising it here also covers
# `docker compose up -d` itself, which no test can.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # The `dev` *extra*, not the `dev` dependency-group: pytest is declared in the
      # extra, and a bare `uv sync` leaves it out.
      - name: Install
        run: uv sync --extra dev

      # node is optional substrate: tests/js/*.test.mjs run under it as part of the
      # pytest run, driven by test_console_js.py, and a checkout without node skips
      # them. Installed here so CI runs the suite the operator does rather than a
      # quietly smaller one.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint
        run: uv run ruff check src tests

      # Pinned to the patch in pyproject.toml. ty is pre-1.0 and its inference moves
      # between releases, so the version is raised deliberately with its new diagnostics
      # fixed in the same change, never picked up by a floating spec on a Tuesday.
      - name: Types
        run: uv run ty check src

      - name: Tests
        run: uv run pytest -q

      # Structure, in two directions. `rules --gate` fails on a dependency the declared
      # layers forbid and `arch/model.yaml` does not accept — and on an `accepted` entry
      # that no longer happens, which is exit 2 and equally a thing to fix. `scan --check`
      # fails when the committed model no longer matches the code it claims to measure.
      #
      # Neither needs the graph, so both run before compose comes up.
      - name: Structure — declared rules
        run: uv run thalamus arch rules --gate

      - name: Structure — model freshness
        run: uv run thalamus arch scan --check

      # Built-but-never-used is the largest single defect class in this tracker. This is
      # the static half of catching it: a definition under src/ that nothing outside
      # tests/ refers to. Exceptions are declared in arch/model.yaml with their reasons,
      # the same mechanism the rule gate uses.
      - name: Structure — dead ends
        run: uv run thalamus arch dead --gate

      # Started before the contract check and waited on by the compose healthcheck the
      # file already declares — the graph accepts a TCP connection several seconds
      # before it answers a query, so polling the port would pass too early.
      - name: Bring up the graph
        run: |
          docker compose up -d --wait --wait-timeout 180
          docker compose ps

      - name: Contract check
        run: uv run thalamus contract check

      - name: Graph logs
        if: failure()
        run: docker compose logs graph
