# The adversarial suite's fast tier. Hermetic by construction: every FAST case runs
# without docker, tmux, a graph, or a model, so this workflow needs no secrets and
# spends nothing. Cases that need real substrate declare it and SKIP here rather than
# failing — a suite that fails on a runner without tmux is reporting on the runner.
#
# Exit codes are load-bearing and are NOT collapsed (see tests/qe/run.py):
#   0  passed, or failed exactly as triaged in tests/qe/expectations.json
#   1  a NEW failure, or a known-red that drifted into a different defect
#   2  a triaged defect now passes — delete its expectation
#   3  a case, or an expectation, is broken
#
# `continue-on-error` is deliberately absent. The whole point of the expectations file
# is that known defects exit 0 on their own, so anything red here is genuinely new.
name: qe-fast

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The suite stamps the revision into every ledger row and reads it via
          # `git rev-parse`, which needs real history rather than a shallow clone.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      # `--extra dev` is load-bearing, not a convenience. Three FAST cases borrow probe
      # helpers out of dev's suite (`test_extraction._floor_graph`,
      # `test_dispatch._descriptor`), and those modules import pytest at module scope —
      # so pytest is substrate for the fast tier even though the suite never runs under
      # it. A bare `uv sync` installs the `dev` dependency-group, not the `dev` extra
      # where pytest is declared, and the cases then die on import.
      - name: Install
        run: uv sync --extra dev

      # jq is a declared substrate for the guard case and is present on ubuntu-latest,
      # but asserting it keeps a silent skip from being mistaken for a pass. pytest is
      # asserted for the same reason and one step earlier than the cases would find it:
      # a missing import surfaces here as an install fault, not as a broken case.
      - name: Confirm declared substrate
        run: |
          jq --version
          uv run python -c "import pytest; print(pytest.__version__)"

      - name: Run the fast tier
        run: uv run python tests/qe/run.py --tier fast

      - name: Ledger
        if: always()
        run: cat ~/.thalamus/qe/runs.jsonl || echo "no ledger written"
