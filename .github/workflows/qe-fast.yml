# The adversarial suite's fast tier. Hermetic by construction: every FAST case runs
# without docker, tmux, a graph, or a model, so this workflow needs no secrets and
# spends nothing. Cases that need real substrate declare it and SKIP here rather than
# failing — a suite that fails on a runner without tmux is reporting on the runner.
#
# Exit codes are load-bearing and are NOT collapsed (see tests/qe/run.py):
#   0  passed, or failed exactly as triaged in tests/qe/expectations.json
#   1  a NEW failure, or a known-red that drifted into a different defect
#   2  a triaged defect now passes — delete its expectation
#   3  a case, or an expectation, is broken
#
# `continue-on-error` is deliberately absent. The whole point of the expectations file
# is that known defects exit 0 on their own, so anything red here is genuinely new.
#
# Two jobs, not one, because one case cannot be made to fit the same gate as the rest.
# `expectation-additions-are-never-silent` (tests/qe/cases/expectation_additions.py) is
# *designed* to go red the moment a reproduction PR adds a known-red entry for a real,
# unfixed defect — that red is the report, not a defect in the PR. `adversarial` is a
# required status check with no bypass in the repo ruleset, so a case that must go red
# on every legitimate addition cannot live inside it without making every such PR
# permanently unmergeable. `mute-review` runs that one case alone, is not required, and
# carries no `continue-on-error` either — its own red is exactly as loud, it simply does
# not block. See the case's docstring, §"Where this runs".
name: qe-fast

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The suite stamps the revision into every ledger row and reads it via
          # `git rev-parse`, which needs real history rather than a shallow clone.
          # `case-erosion-is-never-silent` (tests/qe/cases/case_logic_erosion.py) needs
          # more than that: like the case `mute-review` runs alone, it diffs against the
          # pushed ref's prior tip (or the PR base) and reports MALFORMED — exit 3 — when
          # neither the event payload nor `origin/master`/`origin/HEAD` resolves. Shallow
          # this and that guard goes red for the wrong reason.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      # `--extra dev` is load-bearing, not a convenience. Three FAST cases borrow probe
      # helpers out of dev's suite (`test_extraction._floor_graph`,
      # `test_dispatch._descriptor`), and those modules import pytest at module scope —
      # so pytest is substrate for the fast tier even though the suite never runs under
      # it. A bare `uv sync` installs the `dev` dependency-group, not the `dev` extra
      # where pytest is declared, and the cases then die on import.
      - name: Install
        run: uv sync --extra dev

      # jq is a declared substrate for the guard case and is present on ubuntu-latest,
      # but asserting it keeps a silent skip from being mistaken for a pass. pytest is
      # asserted for the same reason and one step earlier than the cases would find it:
      # a missing import surfaces here as an install fault, not as a broken case.
      - name: Confirm declared substrate
        run: |
          jq --version
          uv run python -c "import pytest; print(pytest.__version__)"

      # Every FAST case except the one `mute-review` runs. Loading `run.py` still
      # imports every case module named in `CASE_MODULES`, so an unloadable case
      # anywhere in the suite is still reported here (MALFORMED), and orphan or
      # mistagged expectations are still checked against the full case set.
      - name: Run the fast tier
        run: uv run python tests/qe/run.py --tier fast --exclude expectation-additions-are-never-silent

      - name: Ledger
        if: always()
        run: cat ~/.thalamus/qe/runs.jsonl || echo "no ledger written"

  # Deliberately not in the repo ruleset's required-checks list — see the job-level
  # comment above and the case's own docstring.
  mute-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The suite stamps the revision into every ledger row and reads it via
          # `git rev-parse`, which needs real history rather than a shallow clone.
          # `expectation-additions-are-never-silent` needs more than that: it diffs
          # expectations.json against the pushed ref's prior tip (or the PR base), and a
          # base it cannot resolve is MALFORMED — exit 3, never a silent pass. Shallow
          # this and the oracle's own guard goes red, correctly.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      # Same reason as `adversarial`: loading any case module needs the `dev` extra,
      # even though this job runs only one of them.
      - name: Install
        run: uv sync --extra dev

      - name: Run the addition gate alone
        run: uv run python tests/qe/run.py --only expectation-additions-are-never-silent

      - name: Ledger
        if: always()
        run: cat ~/.thalamus/qe/runs.jsonl || echo "no ledger written"
