# The architect's model of this repo. Authored above the marker, measured below it.
#
# The authored half is judgement and is never regenerated: what the layers ARE, which
# dependencies are permitted, where the seams sit, and which refactors were rejected and
# why. A rule here is a claim about how this repo is supposed to be shaped; `thalamus
# arch rules` checks the measured edge list against it and reports what disagrees.
#
# `layers` and `rules` start empty. An empty partition places no module, so `arch rules`
# reports every module as unplaced rather than silently passing — declaring the layers is
# the architect's work, not the scanner's.

repo: thalamus
root_commit: 42c50427d61e57731e570bbc26cae228be21aa18
extractor:
  version: 1
  languages:
  - python
  # The core's source root, then one per plugin under `packages/`. One import graph
  # across all of them is what lets `arch rules` see a plugin -> plugin edge at all.
  # Each root added changes what is measured, so it forks the scan key: the `digest`
  # below is re-recorded with it, and scans either side are not compared.
  roots:
  - src
  - packages/thalamus-console/src
  - packages/thalamus-ingest/src
  - packages/thalamus-measure/src
  - packages/thalamus-reflex/src
  import_depth: all
  resolve: deepest-matching-module
  exclude:
  - tests/**
  - lab/**
  - '**/__pycache__/**'
  - '**/node_modules/**'
  - .venv/**
  digest: 4328eead399018b93ed0b60f7af1fa3257d01a3e6f2462cf549d88977c9ae4ee
# The second extraction channel: the dependency an HTTP boundary hides. `app.js` reaches
# `server.py` by issuing requests, so an import-only walk reports the browser surface as
# absent and publishes a propagation cost over the Python half as a fact about the
# system. Enabled here because the match is exact on this repo and was counted by hand:
# 23 client literals, 23 server literals, 23 matched, none unmatched either side.
#
# Turning this on forks the scan key by design — a propagation cost measured with the
# channel on is not comparable to one measured without it, and the key must say so. With
# `enabled: false` the digest is the import policy's alone, so scans taken before this
# channel existed keep the key they were published under.
#
# `clients` is a list of files, not a glob, and every file on it is an element of the
# measurement whether or not the matcher finds a route in it. Globbing the list and
# entering only the files that yielded literals makes the element set a function of the
# matcher's recall, which hides a recall failure inside the number it distorts. It is
# also the larger of this channel's two effects on the headline: measured at 0868c2e,
# the matched edge moves propagation cost 0.02 points and the decision about `sw.js`
# moves it 0.22.
routes:
  version: 2
  enabled: true
  clients:
  - packages/thalamus-console/src/thalamus_console/static/app.js
  - packages/thalamus-console/src/thalamus_console/static/sw.js
  servers:
  - packages/thalamus-console/src/thalamus_console/server.py
  match: exact-literal
  prefix: /api/
  digest: f0c80e2e63424afe61e379e784ba6fc560b742dc501078546cab86e15625c61c
# Layers are listed most-specific-first, because `layer_of` returns the first pattern
# that matches. `entry`, `vocabulary` and `conformance` therefore precede the broad
# package globs that would otherwise swallow them. Read the `rules` block below for the
# intended order; this list is ordered for matching, not for height.
layers:
- name: entry
  includes:
  - src/thalamus/cli.py
  - src/thalamus/__main__.py
  - src/thalamus/__init__.py
  # mcp_server.py is an entry point that happens to live in harness/. It is the process
  # the MCP client launches, and it reaches up into eval and conformance the way
  # cli.py does. Filed as harness, it drags harness into a cycle with all three.
  - src/thalamus/harness/mcp_server.py
- name: vocabulary
  includes:
  - src/thalamus/contract/ontology.py
  - src/thalamus/contract/manifest.py
  - src/thalamus/contract/__init__.py
  # ownership.py reads which paths belong to which scope from the config root, and
  # imports nothing but stdlib and paths.py. A leaf that everything may read is what
  # this layer is.
  - src/thalamus/contract/ownership.py
  # capabilities.py declares dimensions and reads the operator's presets for them; read
  # by manifest.py (which resolves a scope's selection) and by every harness renderer
  # that projects one.
  - src/thalamus/contract/capabilities.py
  # paths.py holds PROJECT_ROOT and imports nothing but stdlib. The checkout root is
  # read from three layers at once, so any home inside one of them is a boundary
  # crossing for the other two.
  - src/thalamus/contract/paths.py
  # artifacts.py is how a pinned artifact is named, hashed and refused — the shared
  # half of `eval/snapshots.py`, with the graph-specific half left there. It imports
  # nothing but stdlib and every kind that pins anything reads it, which is what this
  # layer is. Unrelated to `contract/pinning.py`, which is about pinning a session to
  # a scope; these two words mean different things and the modules share nothing.
  - src/thalamus/snapshotting.py
- name: conformance
  includes:
  - src/thalamus/contract/conformance.py
  - src/thalamus/contract/boundaries.py
  - src/thalamus/contract/pinning.py
  - src/thalamus/contract/probes.py
- name: archive
  includes:
  - src/thalamus/archive/**
- name: substrate
  includes:
  - src/thalamus/substrate/**
- name: harness
  includes:
  - src/thalamus/harness/**
- name: eval
  includes:
  - src/thalamus/eval/**
- name: surfaces
  includes:
  - src/thalamus/arch/**
# The extension points, and the one module of core a plugin is written against for its
# own sake rather than for what it reuses. Stdlib and pluggy only.
- name: extension
  includes:
  - src/thalamus/plugins.py
# One layer per plugin. Each may depend on what its rule below names, from core only and
# never another plugin, and nothing in core may depend on it: a core that imports a
# plugin is a core that does not install alone.
- name: plugin-console
  includes:
  - packages/thalamus-console/src/**
- name: plugin-ingest
  includes:
  - packages/thalamus-ingest/src/**
- name: plugin-measure
  includes:
  - packages/thalamus-measure/src/**
- name: plugin-reflex
  includes:
  - packages/thalamus-reflex/src/**

# Height, low to high: vocabulary, archive < substrate < harness < conformance < eval
# < surfaces < entry, with `extension` a second leaf beside vocabulary and each plugin a
# layer above conformance that only entry-point loading reaches. Each allow-list is closed: a layer may depend on exactly what is
# named and nothing else.
rules:
- layer: vocabulary          # the ontology is the shared word-list; it imports nothing
  may_depend_on: []
- layer: archive             # blob retention, no knowledge of what a blob means
  may_depend_on: []
- layer: substrate
  may_depend_on: [vocabulary, archive]
- layer: harness
  may_depend_on: [vocabulary, archive, substrate, extension]
- layer: conformance         # checkers reach down into everything they check
  may_depend_on: [vocabulary, archive, substrate, harness]
- layer: eval
  may_depend_on: [vocabulary, archive, substrate, harness, conformance]
- layer: surfaces
  may_depend_on: [vocabulary, archive, substrate, harness, conformance, eval]
- layer: entry
  may_depend_on: [vocabulary, archive, substrate, harness, conformance, eval, surfaces,
                  extension]
- layer: extension           # what a plugin is written against; it knows no plugin
  may_depend_on: []
# `conformance` for the room capability rows (`contract/boundaries.py`,
# `contract/probes.py`); `eval` for `eval/cost.py`, which the occasion cost report
# weights burn with.
- layer: plugin-console
  may_depend_on: [vocabulary, harness, conformance, eval, extension]
- layer: plugin-ingest
  may_depend_on: [vocabulary, archive, substrate, harness, conformance, extension]
# `eval` is core's half of the eval loop: the trace tap, `sync`, cost and conditioning.
# The reports over it are thalamus-measure's, which reads `harness` for the shipped
# recipe store.
- layer: plugin-measure
  may_depend_on: [vocabulary, substrate, harness, eval, extension]
# `eval` for the trace tap (`eval/traces.py`, `eval/rates.py`).
- layer: plugin-reflex
  may_depend_on: [vocabulary, archive, substrate, harness, eval, extension]

seams:
- name: ontology-is-the-vocabulary
  at: src/thalamus/contract/ontology.py
  note: >-
    The widest fan-in in the repo (arch, cli, console, eval, harness, substrate)
    and it must stay a leaf. Everything that needs to name a vertex kind depends on it,
    so any import added here is an import added to every layer at once.
- name: conformance-is-not-vocabulary
  at: src/thalamus/contract/conformance.py
  note: >-
    `contract/` holds two layers under one package name. ontology.py and manifest.py are
    leaves with repo-wide fan-in; conformance/boundaries/pinning/probes are checkers that
    reach up into harness and substrate and are used almost only by cli.py. Measured at
    package granularity the two halves collapse into one node, and that single conflation
    accounts for contract's membership in the five-package cycle.

rejected_refactors:
- what: Break the substrate<->harness cycle by moving transcript reading into substrate
  when: 2026-08-13
  why: >-
    One edge holds it: substrate/project_repair.py -> harness/transcripts.py. Moving the
    reader down would put harness-shaped knowledge (transcript formats, per-vendor
    dialects) under substrate, which is the store and should not know what a session is.
    The cheaper cut is to have project_repair accept already-parsed facts from its caller,
    leaving the format knowledge in harness where the per-harness transcript dialects live.

# Edges the rules forbid and the gate tolerates. `thalamus arch rules --gate` exits 1 on
# anything measured and not listed here, and 2 on anything listed here that no longer
# happens — an exception that has stopped firing is deleted, not left to describe a
# design that moved. Every entry states why, because an exception list whose entries do
# not is a list that only grows.
accepted:
- from_path: src/thalamus/harness/bootstrap.py
  to_path: src/thalamus/contract/conformance.py
  reason: >-
    The write gate. `check_session` refuses a session that does not conform, and a gate
    has to be called by the thing it gates, so the edge runs against the height rule by
    construction: conformance sits above harness because checkers reach down into what
    they check, and this one is reached back up to. Removing the edge means moving the
    gate off the write path, which is the property it exists to have.
- from_path: src/thalamus/substrate/project_repair.py
  to_path: src/thalamus/harness/transcripts.py
  reason: >-
    The one edge holding the substrate/harness cycle, with the obvious refactor already
    tried and rejected on 2026-08-13 (see rejected_refactors): moving the transcript
    reader down would put per-vendor session formats under the store. The recorded
    cheaper cut, project_repair taking already-parsed facts from its caller, is unbuilt.

# The dead-end census. `thalamus arch dead --gate` exits 1 on anything reported here and
# not exempted, and 2 on an exemption that no longer matches — the same two directions
# the rule gate uses, and for the same reason.
#
# `reference_extensions` is what keeps the census from accusing live code: the hook
# scripts embed Python heredocs that import from the package, so a symbol whose only
# caller is `role-guard.sh` is reached, not dead. Those blocks are parsed as Python and
# walked by the same reference pass the .py files get — a text match cannot tell a call
# from a mention, and this repo contains both on adjacent lines.
deadends:
  version: 1
  enabled: true
  source_roots: [src, packages/thalamus-console/src, packages/thalamus-ingest/src,
                 packages/thalamus-measure/src, packages/thalamus-reflex/src]
  test_roots: [tests]
  reference_extensions: ['.sh']
  # Modules whose caller is outside the scanned import graph, so a fan-in of zero says
  # nothing about them. Two kinds sit here and the name covers both: a process entry
  # nothing imports because something *runs* it, and a module imported from outside this
  # repository. Each non-obvious entry names which it is — a bare list would leave the
  # next reader unable to tell a declaration from an oversight.
  entry_points:
  - '**/__init__.py'
  - '**/__main__.py'
  - '**/cli.py'
  - '**/conftest.py'
  - '**/static/*'
  # A plugin's registration module, declared under the `thalamus` entry-point group in
  # its package's pyproject.toml and imported by `thalamus.plugins.load`, by name.
  - packages/*/src/*/plugin.py
  # Declared in [project.scripts]; the MCP client launches it as a process.
  - src/thalamus/harness/mcp_server.py
  # Imported by the companion repo thalamus-eval, not by anything here: the WCAG
  # arithmetic stayed in this repo when the research battery split out so that it has one
  # owner across both. `contrast_ratio` inside it is exempted separately — declaring the
  # module silences the orphan finding, not the symbol one.
  - src/thalamus/eval/legibility.py
  kinds: [function, method, class]
  report_unreferenced: false
  exemptions:
  - reason: >-
      Imported by the companion repo thalamus-eval, whose
      src/thalamus_eval/legibility.py re-exports the WCAG arithmetic from here and calls
      contrast_ratio in its degradation transform. The math stayed in this repo when the
      research battery split out (12bd638) so that it has one owner across both, and
      tests/test_console_contrast.py measures the shipped console CSS with it.
    path: src/thalamus/eval/legibility.py
    symbol: contrast_ratio
  - reason: >-
      Called by the companion repo thalamus-eval at src/thalamus_eval/arms.py, which
      refuses to run an eval arm on a CLI whose `arm_blockers` are non-empty and prints
      those blockers. eval/arms.py moved there in 12bd638; the property stayed with the
      registry whose field it reads.
    path: src/thalamus/harness/agents.py
    symbol: AgentCLI.runs_arms

references:
  version: 1
  enabled: true
  roots: [src, packages]
  # Vendored upstream documentation cites paths in the project it documents, which are
  # correctly not in this tree. Excluding it is not a tolerance for broken references —
  # those files are not ours to fix, and counting them would drown the ones that are.
  exclude:
  - '*/node_modules/*'
  - '*/gremlin-docs/*'
  - '*/__pycache__/*'
  - '*/.venv/*'
  # Where a package-relative citation is resolved from. A comment in `harness/` writes
  # a module the way an import writes it; without the third root every
  # such citation in the tree reads as broken.
  search_roots: ['.', src, src/thalamus]
  exemptions: []

