[project]
# Published as `thalamus-memory`; the import name and the CLI stay `thalamus`. The
# bare name on PyPI is GNU Health's federation server.
name = "thalamus-memory"
# Single-sourced from the package, so a tag can never disagree with what an
# installed `thalamus.__version__` reports.
#
# The readme is dynamic too: `README.md` with its relative links rewritten to GitHub
# URLs, below, because PyPI renders it outside the repository.
dynamic = ["version", "readme"]
description = "Federated graph memory for coding agents — with a trust model and a measured utility loop"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jackson Porter" }]
keywords = ["agents", "memory", "knowledge-graph", "gremlin", "llm", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "gremlinpython>=3.7,<3.8",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastmcp>=3.4.0",
    # Loads the plugins installed under the `thalamus` entry-point group
    # (`thalamus.plugins`). pytest's own plugin manager, pure Python.
    "pluggy>=1.5",
]

[project.urls]
Homepage = "https://github.com/Ybx-jp/thalamus"
Repository = "https://github.com/Ybx-jp/thalamus"
Issues = "https://github.com/Ybx-jp/thalamus/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # The suite waits on subprocesses far more than it computes, so it parallelizes
    # well past the core count. `tests/conftest.py` turns this on for the bare
    # whole-suite run only; a run that names a path stays serial.
    "pytest-xdist>=3.6",
    "ruff>=0.4",
    "httpx>=0.28.1",
    # Pinned to the patch, unlike everything else here. ty is pre-1.0: its rule set and
    # its inference both still move between releases, so a floating spec makes a green
    # tree go red on someone else's schedule with no change of ours. Raise it
    # deliberately, with the diagnostics that come with it fixed in the same change.
    "ty==0.0.74",
    # The claims ledger under `ledger/` and its five checkers. A dev dependency
    # because nothing the package runs reads it: it gates the prose, in the
    # pre-commit pass and in CI, and never at runtime. The floor is 0.0.4 because
    # `claims-ledger.toml` sets `citation-slug`, and a release that does not know the
    # key refuses the whole configuration rather than ignoring it.
    "claims-ledger>=0.0.4",
]
# The entailment judge — the eval loop's fast attribution path. Optional because it
# pulls a multi-gigabyte torch build and only the attribution instrument itself needs
# it.
nli = [
    "torch>=2.5",
    "transformers>=4.46",
    "sentence-transformers>=3.3",
]
# The console's frame-theme generators (tools/build-frames.py, make-sample-frame.py).
# Optional because they are authoring tools, not a runtime path: the console reads
# only the file they emit, and that file is a contract anything can produce by hand.
# A tmux bridge has no business depending on an imaging stack.
frames = [
    "pillow>=10.0",
    "numpy>=2.1",
    "scipy>=1.14",
]

[project.scripts]
thalamus = "thalamus.cli:main"
thalamus-mcp = "thalamus.harness.mcp_server:main"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

# The repository's own README, kept relative so that `tests/test_docs_links.py` can hold
# every link to a file that exists. hatch-fancy-pypi-readme's documented substitution
# for exactly this case rewrites them for the published metadata only.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(#'
replacement = '](https://github.com/Ybx-jp/thalamus#'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|mailto:|#)([^)\s]+)\)'
replacement = '](https://github.com/Ybx-jp/thalamus/blob/master/\1)'

# One repository, one lockfile, several distributions. This file is the core,
# `thalamus-memory`; each directory under `packages/` is a plugin that depends on the
# core and on no other plugin, which `thalamus arch rules --gate` enforces over the
# import graph. Copied from uv's workspace layout.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
thalamus-arch = { workspace = true }
thalamus-console = { workspace = true }
thalamus-ingest = { workspace = true }
thalamus-measure = { workspace = true }
thalamus-reflex = { workspace = true }

# The plugins are installed into the development environment by default, so the suite
# and the gates see them. A dependency group rather than an extra because a group is
# not published: the core's metadata on PyPI names no plugin.
[dependency-groups]
plugins = ["thalamus-arch", "thalamus-console", "thalamus-ingest", "thalamus-measure", "thalamus-reflex"]

[tool.uv]
default-groups = ["plugins"]

[tool.hatch.version]
path = "src/thalamus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus"]

# What builds the package, and nothing of the repository around it: `.claude/`, `ledger/`,
# `tests/` and `docs/` are this checkout's development surface, and the suite reads the
# repository's own layout (its `config/`, ledger and arch model), so it cannot run from
# an unpacked sdist anyway. Anchored with a leading `/`, as claims-ledger's are, so a
# pattern matches at the top only.
[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Type checking is gated in CI (.github/workflows/verify.yml) alongside ruff and the
# contract check. The tree is clean, so the gate is "no diagnostics" rather than a
# baseline file — ty has no baseline mechanism, and a suppression carrying a reason is
# a better record than a count in a file nobody reads.
[tool.ty.environment]
python = ".venv"
python-version = "3.11"

# No rule is switched off globally. The optional extras (`nli`, `frames`) are imported inside the functions that need them and are absent from a default
# `uv sync --extra dev`; an unresolved import of one is the declared arrangement rather
# than a defect, and is suppressed at the import site with its reason, so that every
# *other* unresolved import stays an error.
[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The suite waits on subprocesses far more than it computes — hook scripts under
# `set -euo pipefail`, real `git`, real `tmux`, node — so it scales well past the core
# count. Measured 2026-08-26 on a 4-core box: 343s serial, 157s at `-n auto` (4), 68s
# at 12, **47s at 16**, 57s at 24. Sixteen is the knee, and it counts blocked waits
# rather than cores, which is why it is a literal rather than derived from
# `os.cpu_count()`.
#
# It is a flat default rather than one that fans out only for the whole-suite run,
# because pytest has no seam that runs early enough to decide: xdist resolves `-n`
# into `dist` during `pytest_cmdline_main`, before any conftest's `pytest_configure`,
# and `pytest_load_initial_conftests` — which is early enough — cannot be implemented
# by a conftest that hook is itself loading. A root-level `-p` plugin would work only
# if it were importable, which means shipping test machinery in the wheel.
#
# The cost of the flat default is worker startup on a run that cannot amortise it:
# one file measured 1.9s serial against 4.9s at `-n 16`. Pass `-n 0` when iterating
# on a single file.
addopts = "-n 16"
markers = [
    "live_codex_catalog: read codex's model catalog instead of the suite-wide stub (tests/conftest.py)",
]
