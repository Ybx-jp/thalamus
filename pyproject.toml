[project]
name = "thalamus"
version = "0.1.0"
description = "Federated graph memory for coding agents — with a trust model and a measured utility loop"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "gremlinpython>=3.7,<3.8",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastmcp>=3.4.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "httpx>=0.28.1",
]
# Everything a published experiment needs to be re-run by someone who is not us:
# the estimators, the figures, and the page they are rendered into. Kept out of the
# runtime dependency set because the harness must stay installable on a work box
# without a scientific stack — but declared, pinned and installed as one command
# (`uv sync --extra experiments`), because "reproducible at will" cannot rest on a
# reader assembling the environment by guesswork.
experiments = [
    "numpy>=2.1",         # the array layer everything below stands on
    "scipy>=1.14",        # exact tests, bootstrap, distributions
    "matplotlib>=3.9",    # figures, exported as inline SVG
    "pandas>=2.2",        # trace/verdict frames
    "statsmodels>=0.14",  # cluster-robust intervals, GLMs, proportion CIs
    "jinja2>=3.1",        # the experiment write-up template
]
# The entailment judge (docs/04 layer 1's fast path). Split from `experiments`
# because it pulls a multi-gigabyte torch build: an experiment must be re-runnable
# without it, and only the attribution instrument itself needs it.
nli = [
    "torch>=2.5",
    "transformers>=4.46",
    "sentence-transformers>=3.3",
]

[project.scripts]
thalamus = "thalamus.cli:main"
thalamus-mcp = "thalamus.harness.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
