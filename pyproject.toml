[project]
name = "thalamus"
version = "0.1.0"
description = "Federated graph memory for coding agents — with a trust model and a measured utility loop"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "gremlinpython>=3.7,<3.8",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastmcp>=3.4.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "httpx>=0.28.1",
]

[project.scripts]
thalamus = "thalamus.cli:main"
thalamus-mcp = "thalamus.harness.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
